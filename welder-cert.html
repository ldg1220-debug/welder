<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>용접사 자격 인증서 관리</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#1c2530;--mute:#6b7785;--line:#d5dbe1;--accent:#1f5fae;--ok:#1a7f4b;--bad:#c62828;--warn:#b7791f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif}
header{background:#14314f;color:#fff;padding:10px 20px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
header h1{font-size:16px;margin:0 12px 0 0}
nav button{background:none;border:0;color:#cfe0f3;padding:8px 12px;cursor:pointer;font:inherit;border-radius:6px}
nav button.on{background:#fff;color:#14314f;font-weight:600}
main{max-width:1560px;margin:0 auto;padding:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:16px}
h2{font-size:16px;margin:0 0 12px}h3{font-size:14px;margin:14px 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
label{display:flex;flex-direction:column;font-size:12px;color:var(--mute);gap:3px}
input,select,textarea{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:5px;color:var(--ink);background:#fff}
button.b{background:var(--accent);color:#fff;border:0;padding:7px 14px;border-radius:5px;cursor:pointer;font:inherit}
button.b.sec{background:#e8edf2;color:var(--ink)}button.b.red{background:var(--bad)}button.b.sm{padding:3px 8px;font-size:12px}
table.list{width:100%;border-collapse:collapse}
table.list th,table.list td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;white-space:nowrap}
.tw{overflow-x:auto;max-height:70vh;overflow-y:auto;border:1px solid var(--line);border-radius:6px}
.tw table.list th{position:sticky;top:0;z-index:1}
table.list tbody tr:hover{background:#f5f8fb}
table.list tr.gone td{background:#fdeeee}
.wn{color:#b7791f;font-weight:700}
table.list tr.kid td{background:#f7f9fb;color:#5a6672;font-size:13px}table.list tr.kid td:first-child{border-left:3px solid #c9d3de}
.m{display:inline-block;width:20px;text-align:center;font-weight:700}.m.p{color:var(--ok)}.m.f{color:var(--bad)}.m.n{color:#b5bcc5}
td.num,th.num{text-align:center!important}
.bx{white-space:nowrap}
table.list td{overflow:hidden;text-overflow:ellipsis;max-width:0}
table.list td.bx{max-width:none}
table.list.measure td,table.list.nested td{max-width:none;overflow:visible}
table.list th{position:relative}
.rh{position:absolute;right:0;top:0;bottom:0;width:7px;cursor:col-resize;user-select:none}.rh:hover,.rh:active{background:var(--accent);opacity:.5}
.pz{border:2px dashed var(--line);border-radius:6px;min-height:64px;padding:6px;display:flex;align-items:center;gap:8px;color:var(--mute);font-size:12px;cursor:pointer;background:#fafbfc}
.pz:focus,.pz.over{border-color:var(--accent);outline:0;background:#eef5fd;color:var(--accent)}
.lib{display:flex;gap:10px;flex-wrap:wrap}.li{position:relative;border:2px solid var(--line);border-radius:6px;padding:3px;background:repeating-conic-gradient(#eef0f2 0 25%,#fff 0 50%) 50%/12px 12px}
.li.on{border-color:var(--accent);box-shadow:0 0 0 2px #cfe0f3}.li img{height:52px;max-width:120px;cursor:pointer;display:block}
.li b{position:absolute;top:-9px;right:-9px;background:var(--bad);color:#fff;border-radius:50%;width:18px;height:18px;text-align:center;line-height:18px;font-size:12px;cursor:pointer}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#14314f;color:#fff;padding:10px 16px;border-radius:8px;max-width:80vw;z-index:50;display:none;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.pz img{max-height:52px;max-width:90px;border:1px solid var(--line);border-radius:3px;background:#fff}
table.list th{background:#eef2f6;font-size:12px}
.pill{white-space:nowrap;display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;color:#fff}
.pass{background:var(--ok)}.fail{background:var(--bad)}.pending{background:var(--warn)}
.stats{display:flex;gap:12px;flex-wrap:wrap}.stat{flex:1;min-width:150px;text-align:center}.stat b{display:block;font-size:26px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.range td{padding:4px 8px;border-bottom:1px solid var(--line)}
.chk{color:var(--warn);font-size:12px}
.msg{padding:8px 12px;border-radius:6px;margin:8px 0}.msg.err{background:#fdecea;color:var(--bad)}.msg.info{background:#eaf2fb}
.thumb{height:64px;border:1px solid var(--line);border-radius:4px}
.hide{display:none}
#modal{position:fixed;inset:0;background:#6b7785;overflow:auto;z-index:10}
#modal .bar{position:sticky;top:0;z-index:2;padding:8px 14px;background:#14314f;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#modal .tip{color:#cfe0f3;font-size:12px}#modal .tip b{color:#fff}
#modal .sheet{width:max-content;max-width:100%;margin:16px auto;background:#fff;box-shadow:0 4px 24px rgba(0,0,0,.4)}
/* ---- 인증서 (화면 미리보기 & 인쇄 공용) ---- */
.cert{width:210mm;height:296.5mm;overflow:hidden;padding:6mm 9mm;background:#fff;color:#000;font:9pt/1.35 "Malgun Gothic",Arial,sans-serif;position:relative;box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.cert table{width:100%;border-collapse:collapse}.cert td,.cert th{border:1px solid #000;padding:1.5px 4px;vertical-align:middle}
.cert th{font-size:9pt}.cert .sm{font-size:7pt}
.cert .top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:5mm;margin-bottom:2mm}
.cert .co{justify-self:start;font-weight:700;font-size:13pt}.cert .co img{max-height:16mm;max-width:52mm;display:block}
.cert .ti{text-align:center}.cert .ti b{display:block;font-size:14pt}.cert .ti span{font-size:12pt;font-weight:700}
.cert .tm{justify-self:end;min-width:34mm;max-width:52mm;border:1px solid #000;text-align:center;padding:2mm 3mm}.cert .tm b{display:block;font-size:13pt}.cert .tm span{font-size:8pt;font-weight:700}
.cert .val{color:#1a33d6;font-weight:700}.cert .c{text-align:center;font-weight:700}
.cert .ln{margin:.8mm 0}.cert .two{display:flex;justify-content:space-between;gap:6mm}.cert .two>div:first-child{flex:1}
.cert .info{display:flex;gap:4mm;margin-bottom:2.5mm}.cert .lf{flex:1.35}.cert .rf{flex:1}.cert .rf .phb{margin-top:1.5mm}
.cert .phb{width:34mm;margin-left:0}.cert .phb td{height:38mm;text-align:center;padding:0}.cert .en{color:#1a33d6;font-weight:700;padding-top:1mm}
.cert img.photo{width:33mm;height:37mm;object-fit:cover;display:block;margin:0 auto}
.cert .rng th{background:#fff}.cert .rng td{height:6.3mm;padding-top:0;padding-bottom:0}.cert .rng td:first-child{width:30%}
.cert .lb{text-align:center;line-height:1.1}.cert .lb b{display:block;font-size:9pt}.cert .lb i{display:block;font-size:6.5pt;font-style:normal;font-weight:700}
.cert .bot{display:flex;gap:6mm;margin-top:1mm}.cert .tt{width:45%}.cert .tt td,.cert .tt th{height:5.8mm;padding-top:0;padding-bottom:0}.cert .lb1 i{font-size:7pt;font-style:normal;font-weight:700}
.cert .mk{color:#d10000;font-weight:700;font-size:11pt}
.cert .rt{flex:1;position:relative}.cert .sigbox{position:absolute;right:0;top:3mm;width:44mm;height:19mm}
.cert .sigbox .stamp{position:absolute;left:0;top:0;height:18mm;opacity:.92}.cert .sigbox .sign{position:absolute;left:21mm;top:2mm;height:14mm;max-width:23mm}
.cert .prol{display:flex;gap:4mm;margin-top:1.5mm}.cert .prol table{flex:1}
.wdoc{width:210mm;min-height:297mm;padding:8mm 9mm;background:#fff;color:#000;font:8.6pt/1.35 "Malgun Gothic",Arial,sans-serif;box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.wdoc table{width:100%;border-collapse:collapse;margin-bottom:2mm}.wdoc td,.wdoc th{border:1px solid #000;padding:1.5mm 2mm;vertical-align:top}.wdoc th{background:#f2f2f2;font-size:8.5pt}
.wdoc .wh{display:flex;justify-content:space-between;align-items:center;border:1px solid #000;padding:2mm 4mm;margin-bottom:2mm}.wdoc .wt b{display:block;font-size:15pt}.wdoc .wt span{font-size:10pt;font-weight:700}
.wdoc .wc{text-align:right;font-weight:700}.wdoc .wc img{max-height:13mm;display:block;margin-left:auto}.wdoc .wl{margin:.6mm 0}.wdoc .val{color:#1a33d6;font-weight:700}
.wdoc .sk{height:42mm;text-align:center}.wdoc .sk img{max-height:40mm;max-width:100%}.wdoc .wp td{text-align:center;height:6mm;padding:.5mm 1mm}.wdoc .wsig{position:relative;margin-top:6mm;min-height:24mm;text-align:left;padding-left:2mm}
.wdoc .wsig .stamp{position:absolute;left:38mm;top:0;height:16mm;opacity:.9}.wdoc .wsig .sign{position:absolute;left:56mm;top:2mm;height:13mm;max-width:24mm}
.cert+.cert,.wdoc+.wdoc{margin-top:14px}
#libpick{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30;overflow:auto;padding:24px}.libwin{background:#fff;border-radius:10px;padding:16px;max-width:1100px;margin:0 auto}
.libg{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}.lc{border:1px solid var(--line);border-radius:8px;padding:8px;background:#fff}.lt{height:130px;background:#fff;border:1px solid #eee}.lt img{width:100%;height:100%;object-fit:contain}
.ln2{display:flex;flex-direction:column;margin-top:4px}.ln2 b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ln2 small{color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cert .wm{position:absolute;left:0;right:0;top:105mm;text-align:center;font-size:40pt;font-weight:900;color:rgba(200,0,0,.14);transform:rotate(-22deg);pointer-events:none;z-index:3}
@media print{
  @page{size:A4;margin:0}
  body{background:#fff}
  header,main,#modal .bar{display:none!important}
  #modal{position:static;background:none;overflow:visible}
  #modal .sheet{margin:0;box-shadow:none;width:auto}
  #modalBody{zoom:1!important}
  .cert{break-after:page;page-break-after:always}.cert:last-child{break-after:auto;page-break-after:auto}.cert+.cert{margin-top:0}
  .wdoc{break-after:page}.wdoc:last-child{break-after:auto}.wdoc+.wdoc{margin-top:0}
}
</style>
</head>
<body>
<header>
  <h1>🔧 용접사 자격 인증서 관리 <span style="font-weight:400;font-size:12px;opacity:.7">ISO 9606-1</span> <span id="ver" title="이 화면이 최신이 아니면 파일을 다시 받아 교체하세요" style="font-weight:400;font-size:11px;background:#2a5a8a;border-radius:8px;padding:1px 8px;margin-left:6px">v38 · 형상 도구</span></h1>
  <nav id="nav"></nav>
</header>
<main id="view"></main>
<div id="modal" class="hide"><div class="bar">
  <button class="b" onclick="window.print()">🖨 인쇄 / PDF로 저장</button>
  <button class="b sec" onclick="closeModal()">닫기 (Esc)</button>
  <span class="tip">열리는 인쇄 창에서 <b>대상 → "PDF로 저장"</b> 선택 → 용지 <b>A4</b> · 여백 <b>없음</b> · <b>배경 그래픽</b> 체크 → 저장</span></div>
  <div class="sheet"><div id="modalBody"></div></div></div>

<script>
/*ENGINE-START*/
// ===================== ISO 9606-1 규격 엔진 (DOM 미사용, 순수 함수) =====================
// confidence: 'high' = 샘플 인증서/규격 조항으로 확신, 'check' = 규격서 원문(표) 대조 필요
const STD = 'ISO 9606-1';
const INF = Infinity;
function fmtN(n){ return String(Number(Number(n).toFixed(2))); }
function pd(s){ const [y,m,d]=String(s).slice(0,10).split('-').map(Number); return new Date(Date.UTC(y,m-1,d)); }
function iso(dt){ return dt.toISOString().slice(0,10); }

// 9.3 a) : 유효기간 = 용접일 + 3년 - 1일
function calcExpire(weldingDate){
  const d=pd(weldingDate), y=d.getUTCFullYear()+3, m=d.getUTCMonth(), day=d.getUTCDate();
  let e=new Date(Date.UTC(y,m,day));
  if(e.getUTCMonth()!==m) e=new Date(Date.UTC(y,m+1,0)); // 2/29 -> 2/28
  return iso(new Date(e.getTime()-86400000));
}
function addDays(d,n){ const x=pd(d); x.setUTCDate(x.getUTCDate()+n); return iso(x); }
function defaultIssue(weldingDate){ return addDays(weldingDate,14); } // 발행일 미입력 시: 용접일 + 2주
function validityText(w,e){ return `${w} ~ ${e} (refer to 9.3 a)`; }
function monthsBetween(a,b){ // 꽉 찬 개월 수
  const s=pd(a), e=pd(b); let m=(e.getUTCFullYear()-s.getUTCFullYear())*12+e.getUTCMonth()-s.getUTCMonth();
  const last=new Date(Date.UTC(e.getUTCFullYear(),e.getUTCMonth()+1,0)).getUTCDate();
  if(e.getUTCDate()<Math.min(s.getUTCDate(),last)) m--; return Math.max(m,0);
}
// 상태: expired(적색) / renewal(황색: 경과개월 > 갱신횟수*6+6) / null
function certAlert(weldingDate, expireDate, renewalCount, today){
  if(today>expireDate) return 'expired';
  if(monthsBetween(weldingDate,today) > renewalCount*6+6) return 'renewal';
  return null;
}

// 합/불 판정. 기본은 ISO 9606-1 Table 1 (BW: VT + [RT/UT 또는 굽힘/파단], FW: VT + [Macro 또는 파단]).
// companyStrict=true 이면 사내 기준(BW: VT+RT/UT+Bend, FW: VT+Macro 모두).
function judge(joint, t, companyStrict){
  const v=k=>t[k]||'na';
  const all=['vt','rtut','bend','macro','fracture','additional'].map(v);
  if(all.includes('fail')) return 'fail';
  if(joint==='BW'){
    if(v('vt')!=='pass') return 'pending';
    if(companyStrict) return (v('rtut')==='pass'&&v('bend')==='pass')?'pass':'pending';
    return (v('rtut')==='pass'||v('bend')==='pass'||v('fracture')==='pass')?'pass':'pending';
  }
  if(v('vt')!=='pass') return 'pending';
  if(companyStrict) return v('macro')==='pass'?'pass':'pending';
  return (v('macro')==='pass'||v('fracture')==='pass')?'pass':'pending';
}

// VT는 RT/UT·굽힘·단면 시험보다 먼저 수행하므로, 다음 단계 결과(Pass/Fail)가 있으면 VT는 통과한 것으로 본다.
// VT에 Fail이 명시된 경우는 그대로 둔다.
function applyImpliedVT(t){ const v=k=>t[k]||'na'; if(v('vt')!=='na') return t;
  return ['rtut','bend','macro','fracture','additional'].some(k=>v(k)==='pass'||v(k)==='fail')?{...t,vt:'pass'}:t; }

const POS_BW={PA:['PA'],PC:['PA','PC'],PE:['PA','PC','PD','PE'],PF:['PA','PF'],PG:['PG']};
const POS_FW={PA:['PA'],PB:['PA','PB'],PC:['PA','PB','PC'],PD:['PA','PB','PD'],PF:['PA','PB','PF'],PG:['PG']};
const POS_HIGH={BW:['PA','PC','PF'],FW:[]}; // 샘플/확신 있는 항목
const FILLER_GRP={FM1:['FM1','FM2'],FM2:['FM2']};
const FILLER_TYPE={S:['S','M'],M:['M'],B:['B']};
const BACKING={'ss nb':['ss nb','ss mb','bs'],'ss mb':['ss mb'],'bs':['bs'],'N/A':['N/A']};

function thicknessRange(joint,t){
  if(!(t>0)) return null;
  if(joint==='BW'){
    if(t<3)  return {lo:t,hi:2*t};
    if(t<12) return {lo:3,hi:2*t};
    return {lo:3,hi:INF};
  }
  return t<3?{lo:t,hi:2*t}:{lo:3,hi:INF}; // FW
}
function rangeText(r,sym){ if(!r) return '-'; if(r.hi===INF) return sym==='t'?`≥ ${r.lo.toFixed(1)}`:`${fmtN(r.lo)} ≤ ${sym}`; return `${fmtN(r.lo)} ≤ ${sym} ≤ ${fmtN(r.hi)}`; } // 양식: 두께 '≥ 3.0', 용접두께 '3 ≤ s'
function processCode(p){ return String(p||'').trim().split(/\s+/)[0]; }

// input: {process,productType:'P'|'T',pipeDiameter,joint:'BW'|'FW',transfer,fillerGroup,fillerType,fillerDesignation,
//        gas,backing,thickness,deposited,position,weldingDate}
function calculateRangeOfApproval(input, standard){
  standard = standard||STD;
  if(standard!==STD) return {manual_review_required:true, warnings:[`규격 ${standard} 미지원`], items:[]};
  const i=input, W=[], items=[]; let manual=false;
  const add=(key,label,test,range,source,confidence)=>{ items.push({key,label,test,range,source,confidence:confidence||'high'}); };
  const j=i.joint, code=processCode(i.process), t=Number(i.thickness), s=Number(i.deposited||i.thickness);

  add('process','용접방법 Welding process',i.process,i.process,'ISO 9606-1 5.2 / Table 5');
  if(!['135','136','138','141','121','111','114','131','311'].includes(code)) W.push(`공정 ${code}: 규격서 확인 필요`);
  if(code==='311'){ manual=true; W.push('311(가스용접)은 두께 범위 규칙이 달라 자동 산출 불가 → 수동 검토'); }

  // 제품 형태
  if(i.productType==='T'){
    const D=Number(i.pipeDiameter);
    let rng; if(!(D>0)) {rng='-'; W.push('관 외경(D) 미입력');} else rng = D<=25?`${fmtN(D)} ≤ D ≤ ${fmtN(2*D)}`:`D ≥ ${fmtN(Math.max(0.5*D,25))}`;
    add('product','판재 또는 파이프 Plate or pipe','T','T, P','ISO 9606-1 Table 6','check');
    add('diameter','파이프 직경 Pipe diameter',D>0?fmtN(D):'-',rng,'ISO 9606-1 Table 6','check');
  }else{
    add('product','판재 또는 파이프 Plate or pipe','P','P, T (F:D≥500mm / R:D≥75mm)','ISO 9606-1 Table 6 (샘플 인증서)');
    add('diameter','파이프 직경 Pipe diameter','N/A','N/A','ISO 9606-1 Table 6');
  }
  add('joint','용접 유형 Type of Weld',j,j,'ISO 9606-1 Table 7 / 5.4','check');
  if(j==='FW') W.push('필릿 시험은 맞대기 자격과 별개 (규격서 확인)');

  // 이행 모드(GMAW 계열만)
  if(/^13/.test(code)){
    const tr=i.transfer||'globular/spray';
    const rng=tr==='short'?'Short circuit':tr==='pulsed'?'Pulsed':'Globular or Spray';
    add('transfer','용접 이행 Transfer mode',tr==='globular/spray'?'Globular or Spray':tr==='short'?'Short circuit':'Pulsed',rng,'ISO 9606-1 5.3(샘플 인증서)', tr==='globular/spray'?'high':'check');
  }else add('transfer','용접 이행 Transfer mode','-','-','—');

  add('material','모재 그룹 Material Group',i.materialGroup||'-','-','ISO 9606-1 (샘플 인증서)','check');
  // 용가재
  const fg=String(i.fillerGroup||'').replace(/\s/g,'');
  if(FILLER_GRP[fg]) add('fillerGroup','용가재 그룹 Filler material group',fg,FILLER_GRP[fg].join(', '),'ISO 9606-1 Table 3', fg==='FM1'?'high':'check');
  else if(fg){ manual=true; W.push(`용가재 그룹 ${fg}: Table 3 수동 확인 필요`); add('fillerGroup','용가재 그룹 Filler material group',fg,'수동 확인','ISO 9606-1 Table 3','check'); }
  const ft=i.fillerType||'S';
  add('fillerType','용가재 종류 Filler material designation',ft,(FILLER_TYPE[ft]||[ft]).join(', '),'ISO 9606-1 Table 4', ft==='S'?'high':'check');
  add('gas','보호가스 Shielding gas',i.gas||'-',i.gas?'Similar shielding gas':'-','ISO 9606-1 Table 5');

  // 백킹/이면 처리
  const bk=i.backing||'N/A';
  add('backing','가우징/배킹 Gouging/Backing','N/A','N/A','양식(샘플 인증서)'); // ss nb/ss mb 는 아래 '기타 Weld details' 행에 표기

  // 두께
  const tr=thicknessRange(j,t), sr=thicknessRange(j,s);
  add('thickness','시험재 두께 Material Thickness',fmtN(t),rangeText(tr,'t'),'ISO 9606-1 Table 8', 'high');
  add('deposited','용접 두께 Deposited Thickness',fmtN(s),rangeText(sr,'s'),'ISO 9606-1 Table 8', 'high');

  // 용접 자세
  const posTable=j==='BW'?POS_BW:POS_FW, pos=String(i.position||'').toUpperCase();
  if(posTable[pos]) add('position','용접자세 Welding Position',pos,posTable[pos].join(', '),'ISO 9606-1 Table 9', (POS_HIGH[j]||[]).includes(pos)?'high':'check');
  else { manual=true; W.push(`자세 ${pos||'(미입력)'}: 자동 산출표에 없음 → 수동 검토`); add('position','용접자세 Welding Position',pos||'-','수동 확인','ISO 9606-1 Table 9','check'); }

  add('details','기타 Weld details',j==='BW'?bk:'-', j==='BW'?(BACKING[bk]||[bk]).join(', '):'-','ISO 9606-1 Table 7', bk==='ss nb'?'high':'check');
  return {items, warnings:W, manual_review_required:manual, expire: i.weldingDate?calcExpire(i.weldingDate):null};
}

function designation(i){
  const code=processCode(i.process), fm=String(i.fillerGroup||'').replace(/\s/g,'');
  const parts=['EN ISO 9606-1',code,i.productType||'P',i.joint,fm,i.fillerType||'S',`t${fmtN(i.thickness)}`,i.position];
  if(i.joint==='BW') parts.push('ss '+(/mb|ceramic/i.test(i.backing||'')?'mb':'nb'));
  return parts.filter(Boolean).join(' ');
}
/*ENGINE-END*/

<script>
// ===================== 저장소 (IndexedDB) =====================
const DB={db:null,
  open(){return new Promise((res,rej)=>{const r=indexedDB.open('welder-cert',4);
    r.onupgradeneeded=e=>{const d=e.target.result, has=n=>d.objectStoreNames.contains(n);
      if(!has('welders')) d.createObjectStore('welders',{keyPath:'id',autoIncrement:true});
      if(!has('records')) d.createObjectStore('records',{keyPath:'id',autoIncrement:true});
      if(!has('settings')) d.createObjectStore('settings',{keyPath:'key'});
      if(!has('images')) d.createObjectStore('images',{keyPath:'id',autoIncrement:true});
      if(!has('wps')) d.createObjectStore('wps',{keyPath:'id',autoIncrement:true});
      if(!has('pqr')) d.createObjectStore('pqr',{keyPath:'id',autoIncrement:true});
      if(!has('joints')) d.createObjectStore('joints',{keyPath:'id',autoIncrement:true});};
    r.onsuccess=e=>{this.db=e.target.result;res()};r.onerror=()=>rej(r.error);});},
  tx(s,m,f){return new Promise((res,rej)=>{const t=this.db.transaction(s,m);const q=f(t.objectStore(s));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error);});},
  all(s){return this.tx(s,'readonly',o=>o.getAll());},
  put(s,v){return this.tx(s,'readwrite',o=>o.put(v));},
  putMany(s,arr){return new Promise((res,rej)=>{const t=this.db.transaction(s,'readwrite');const o=t.objectStore(s);const ids=[];arr.forEach((v,i)=>{const q=o.put(v);q.onsuccess=()=>ids[i]=q.result;});t.oncomplete=()=>res(ids);t.onerror=()=>rej(t.error);});},
  del(s,id){return this.tx(s,'readwrite',o=>o.delete(id));},
  clear(s){return this.tx(s,'readwrite',o=>o.clear());}
};
const DEFAULT_SETTINGS={company:'',team:'',examiner:'',location:'',standardLabel:'KS B ISO 9606-1:2012',refPrefix:'EN ISO 9606-1-RM',refSeqMode:'last3',strict:false,impliedVT:true,examBody:'',logo:'',signature:'',stamp:''};
let S={...DEFAULT_SETTINGS}, welders=[], records=[], images=[], wpsMaster=[], pqrMaster=[], joints=[];
async function load(){
  welders=await DB.all('welders'); records=await DB.all('records');
  const st=await DB.all('settings'); S={...DEFAULT_SETTINGS}; st.forEach(x=>S[x.key]=x.value);
  images=await DB.all('images'); wpsMaster=await DB.all('wps'); pqrMaster=await DB.all('pqr'); joints=await DB.all('joints');
  // 이전 버전에서 설정에만 저장돼 있던 이미지를 보관함으로 옮긴다
  let moved=false; for(const k of ['logo','signature','stamp']) if(S[k]&&!images.some(i=>i.kind===k&&i.data===S[k])){ await DB.put('images',{kind:k,data:S[k],name:'기존 이미지',created:Date.now()}); moved=true; }
  if(moved) images=await DB.all('images');
}
async function saveSettings(){ for(const k in S) await DB.put('settings',{key:k,value:S[k]}); }
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const RES={pass:'Pass',fail:'Fail',na:'미실시'};
const JLBL={pass:'합격',fail:'불합격',pending:'진행중'};
function pill(st,t){return `<span class="pill ${st}"${t?` title="${t}"`:''}>${JLBL[st]}</span>`;}
function fileToDataURL(file,max,png){ // 이미지를 축소해 DB 용량을 줄인다 (png=true: 투명 배경 유지)
  return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{
    const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');
    c.width=im.width*k;c.height=im.height*k;const x=c.getContext('2d');if(!png){x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);}x.drawImage(im,0,0,c.width,c.height);
    res(png?c.toDataURL('image/png'):c.toDataURL('image/jpeg',.85));};im.onerror=()=>rej(new Error('이 이미지 형식은 브라우저가 열 수 없습니다 (PNG/JPG로 저장해서 사용하세요)'));im.src=r.result;};r.onerror=()=>rej(new Error('파일을 읽을 수 없습니다'));r.readAsDataURL(file);});
}
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();}

// ===================== 공통 유틸: 열 너비 조절, 이미지 붙여넣기, 자동완성 =====================
function rz(box,key){ // 표 머리글 경계를 끌어 열 너비 조절 (엑셀처럼), 너비는 브라우저에 기억
  const t=box.querySelector('table'); if(!t) return;
  const ths=[...t.querySelectorAll('thead th')]; let saved=null;
  try{saved=JSON.parse(localStorage.getItem('cw-'+key));}catch(e){}
  const nom=[...t.querySelectorAll('tr.nom')]; nom.forEach(r=>r.style.display='none');
  t.classList.add('measure'); t.style.width='max-content'; t.style.tableLayout='auto';
  const nat=ths.map(th=>Math.min(Math.max(Math.ceil(th.getBoundingClientRect().width)+6,48),th.textContent.trim()?280:620));
  nom.forEach(r=>r.style.display='');
  const w=saved&&saved.length===ths.length?saved.slice():nat.slice();
  const cg=document.createElement('colgroup'); w.forEach(x=>{const c=document.createElement('col');c.style.width=x+'px';cg.appendChild(c);}); t.prepend(cg);
  const total=()=>{t.style.width=w.reduce((a,b)=>a+b,0)+'px';}; t.style.tableLayout='fixed'; t.classList.remove('measure'); total();
  const save=()=>{try{localStorage.setItem('cw-'+key,JSON.stringify(w));}catch(e){}};
  ths.forEach((th,i)=>{ const h=document.createElement('span'); h.className='rh'; h.title='드래그: 너비 조절 / 더블클릭: 자동 맞춤'; th.appendChild(h);
    h.onmousedown=e=>{e.preventDefault();e.stopPropagation();const x0=e.clientX,w0=w[i];
      const mv=ev=>{w[i]=Math.max(36,w0+ev.clientX-x0);cg.children[i].style.width=w[i]+'px';total();};
      const up=()=>{document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);save();};
      document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up);};
    h.ondblclick=()=>{w[i]=nat[i];cg.children[i].style.width=w[i]+'px';total();save();}; });
}
function resetWidths(){ try{Object.keys(localStorage).filter(k=>k.startsWith('cw-')).forEach(k=>localStorage.removeItem(k));}catch(e){} render(); }
const uniq=(arr)=>{const c={};arr.forEach(v=>{v=String(v??'').trim();if(v)c[v]=(c[v]||0)+1;});return Object.keys(c).sort((a,b)=>c[b]-c[a]);}; // 많이 쓴 순
const dl=(id,arr)=>`<datalist id="${id}">${arr.map(v=>`<option value="${esc(v)}">`).join('')}</datalist>`;
// 이미지 붙여넣기 칸(.pz): 클릭 후 Ctrl+V, 이미지 끌어놓기
const pzHTML=(key,url,hint)=>`<div class="pz" tabindex="0" data-key="${key}">${url?`<img src="${url}">`:''}<span>${hint||'클릭 후 Ctrl+V (이미지 붙여넣기) · 이미지 파일 끌어놓기'}</span></div>`;
let PZ=null;
function toast(m,ms=7000){ let t=$('#toast'); if(!t){t=document.createElement('div');t.id='toast';document.body.appendChild(t);} t.textContent=m; t.style.display='block'; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display='none',ms); }
document.addEventListener('focusin',e=>{const z=e.target.closest&&e.target.closest('.pz'); if(z) PZ=z;});
document.addEventListener('click',e=>{const z=e.target.closest&&e.target.closest('.pz'); if(z){PZ=z;z.focus();}});
document.addEventListener('paste',async e=>{
  const act=document.activeElement, z=(act&&act.closest&&act.closest('.pz'))||((act===document.body&&PZ&&document.body.contains(PZ))?PZ:null);
  if(!z) return; // 붙여넣기 칸이 선택돼 있을 때만 가로챈다 (일반 입력칸의 붙여넣기는 그대로)
  const cd=e.clipboardData; if(!cd) return; e.preventDefault();
  let file=[...(cd.files||[])].find(f=>f.type.startsWith('image/'));
  if(!file){const it=[...(cd.items||[])].find(i=>i.kind==='file'&&i.type.startsWith('image/')); if(it) file=it.getAsFile();}
  if(!file){ // 웹페이지/문서에서 복사한 이미지(data URI)
    const m=(cd.getData('text/html')||'').match(/<img[^>]+src=["'](data:image\/[^"']+)["']/i);
    if(m){ try{const b=await (await fetch(m[1])).blob(); file=new File([b],'pasted.'+(b.type.split('/')[1]||'png'),{type:b.type});}catch(_){} } }
  if(!file){ toast('클립보드에 이미지가 없습니다. (감지된 형식: '+([...(cd.types||[])].join(', ')||'없음')+')\n이미지를 우클릭 → "이미지 복사"하거나, 캡처(Win+Shift+S) 후 붙여넣으세요. 파일 탐색기에서 복사한 경우엔 아래 "파일 선택"을 쓰세요.'); return; }
  await setPz(z.dataset.key,file); });
document.addEventListener('dragover',e=>{const z=e.target.closest&&e.target.closest('.pz'); if(z){e.preventDefault();z.classList.add('over');}});
document.addEventListener('dragleave',e=>{const z=e.target.closest&&e.target.closest('.pz'); if(z) z.classList.remove('over');});
document.addEventListener('drop',async e=>{const z=e.target.closest&&e.target.closest('.pz'); if(!z) return; e.preventDefault(); z.classList.remove('over');
  const f=[...e.dataTransfer.files].find(x=>x.type.startsWith('image/')); if(f) await setPz(z.dataset.key,f); else toast('이미지 파일이 아닙니다.');});
function syncSettingsForm(){ const f=$('#sf'); if(!f) return; const fd=new FormData(f);
  for(const k of ['company','team','examiner','location','standardLabel','refPrefix','examBody','refSeqMode']) if(fd.has(k)) S[k]=fd.get(k); S.strict=fd.get('strict')==='on'; S.impliedVT=fd.get('impliedVT')==='on'; }
async function setPz(key,file){
  try{
    if(key.startsWith('wps:')&&WD){ const url=await fileToDataURL(file,900,true); collectDoc(); WD.obj.sketches[key.slice(4)]=url; vWpsDoc(); toast('스케치를 적용했습니다. 저장을 눌러 확정하세요.',3000); return; }
    const url=await fileToDataURL(file,key==='logo'?500:400,key!=='photo');
    if(key==='photo'){ window._photo=url; const z=document.querySelector('.pz[data-key=photo]'); if(z) z.outerHTML=pzHTML('photo',url,'사진 적용됨 — 저장을 누르세요'); return; }
    syncSettingsForm(); // 입력 중이던 텍스트가 사라지지 않게
    if(!images.some(i=>i.kind===key&&i.data===url)) await DB.put('images',{kind:key,data:url,name:file.name||'',created:Date.now()});
    S[key]=url; await saveSettings(); await load(); vSettings(); toast('저장했습니다. 아래 보관함에서 언제든 다시 선택할 수 있습니다.',3500);
  }catch(err){ toast('이미지를 처리하지 못했습니다: '+(err.message||err)); }
}
async function pasteBtn(key){ // 브라우저 권한이 허용되면 버튼으로도 붙여넣기
  try{ const items=await navigator.clipboard.read(); const seen=[];
    for(const it of items){ seen.push(...it.types); const t=it.types.find(x=>x.startsWith('image/')); if(t){ const b=await it.getType(t); return setPz(key,new File([b],'clipboard.'+t.split('/')[1],{type:t})); } }
    toast('클립보드에 이미지가 없습니다. (감지된 형식: '+(seen.join(', ')||'없음')+')');
  }catch(e){ toast('클립보드를 읽지 못했습니다 ('+(e.message||e)+'). 칸을 클릭하고 Ctrl+V를 누르거나 "파일 선택"을 사용하세요.'); } }
async function pickImg(key,inp){ const f=inp.files[0]; inp.value=''; if(f) await setPz(key,f); }
async function useImg(id,kind){ syncSettingsForm(); if(id){const im=images.find(x=>x.id===id); S[im.kind]=im.data;} else S[kind]=''; await saveSettings(); vSettings(); }
async function delImg(id){ const im=images.find(x=>x.id===id); if(!confirm('보관함에서 이 이미지를 삭제할까요?')) return; syncSettingsForm();
  await DB.del('images',id); if(S[im.kind]===im.data) S[im.kind]=''; await saveSettings(); await load(); vSettings(); }
const IMG_KINDS={logo:'회사 로고',signature:'서명',stamp:'직인/도장'};
function imgSection(){ return Object.entries(IMG_KINDS).map(([k,l])=>{ const lib=images.filter(i=>i.kind===k).sort((a,b)=>b.id-a.id);
  return `<div style="border:1px solid var(--line);border-radius:8px;padding:12px;margin-top:10px"><b>${l}</b> <small style="color:var(--mute)">${S[k]?'— 파란 테두리가 현재 사용 중':'— 사용 중인 이미지 없음'}</small>
   <div class="grid" style="margin-top:8px;grid-template-columns:minmax(230px,1fr) 2fr">
    <div>${pzHTML(k,null,'클릭 후 Ctrl+V · 이미지 끌어놓기')}<div class="row" style="margin-top:6px"><button type="button" class="b sm sec" onclick="pasteBtn('${k}')">📋 클립보드에서 붙여넣기</button></div>
     <div class="row" style="margin-top:6px"><input type="file" accept="image/*" onchange="pickImg('${k}',this)" style="max-width:100%"></div></div>
    <div><div style="font-size:12px;color:var(--mute);margin-bottom:6px">보관함 — 클릭하면 사용, × 삭제</div><div class="lib">${lib.map(i=>`<span class="li ${S[k]===i.data?'on':''}"><img src="${i.data}" onclick="useImg(${i.id})" title="${esc(i.name||'')} · ${new Date(i.created).toLocaleDateString()}"><b onclick="delImg(${i.id})">×</b></span>`).join('')||'<small style="color:var(--mute)">아직 저장된 이미지가 없습니다</small>'}</div>
     ${S[k]?`<button type="button" class="b sm sec" style="margin-top:8px" onclick="useImg(0,'${k}')">사용 안 함</button>`:''}</div></div></div>`; }).join(''); }
async function pickPhoto(inp){ const f=inp.files[0]; if(f) await setPz('photo',f); }

// ===================== 화면 =====================
const TABS=[['dash','대시보드'],['welders','용접사'],['records','시험기록(WQT)'],['wps','WPS'],['shape','형상 도구'],['settings','설정 · 백업']];

// 판정. 시험이 끝나지 않은(진행중) 기록이라도 용접사가 퇴사 처리돼 있으면 불합격으로 본다.
function rawStatus(r){return judge(r.joint,r.tests||{},S.strict);}
function isGone(r){const w=welders.find(x=>x.id===r.welderId);return !!w&&w.status==='퇴사';}
function recStatus(r){const st=rawStatus(r); return st==='pending'&&isGone(r)?'fail':st;}
function vDash(){
  const t=today(); const passed=records.filter(r=>recStatus(r)==='pass');
  const active=passed.filter(r=>{const w=welders.find(x=>x.id===r.welderId);return w&&w.status!=='퇴사';});
  const info=active.map(r=>({r,w:welders.find(x=>x.id===r.welderId),exp:calcExpire(r.weldingDate),
    al:certAlert(r.weldingDate,calcExpire(r.weldingDate),(r.renewals||[]).length,t)}));
  const validIds=new Set(info.filter(x=>x.exp>=t).map(x=>x.w.id)), allIds=new Set(info.map(x=>x.w.id));
  const list=(kind,title)=>{const rows=info.filter(x=>x.al===kind);
    return `<div class="card"><h2>${title} (${rows.length})</h2>${rows.length?`<table class="list"><tr><th>용접사</th><th>번호</th><th>용접일</th><th>만료일</th><th>서명갱신</th><th>내용</th></tr>${rows.map(x=>

  $('#view').innerHTML=`<div class="card"><div class="stats">

    <div class="stat"><b style="color:var(--ok)">${validIds.size}</b>자격 유효 인원</div>

    <div class="stat"><b>${records.length}</b>시험 기록</div></div>
    <div style="color:var(--mute);margin-top:8px;font-size:12px">재직자의 합격 인증서 기준. 유효 = 만료되지 않은 합격 인증서 1건 이상.</div></div>
    ${list('expired','🔴 만료')}${list('renewal','🟡 6개월 서명 갱신 필요')}`;
}

const WL={open:new Set()};

function certDetail(w,certs){
  const t=today(); const rows=certs.map(r=>{ const exp=calcExpire(r.weldingDate), al=certAlert(r.weldingDate,exp,(r.renewals||[]).length,t);

    if(cand.length&&confirm(`"${no}" 의 적용 범위(형식·공정·자세·두께)에 맞는 WPS 미지정 시험 기록이 ${cand.length}건 있습니다.\n이 WPS를 지정할까요?`)){ await DB.putMany('records',cand.map(r=>({...r,wpsNo:no}))); await load(); drawWps(); toast(`${cand.length}건에 ${no} 를 지정했습니다.`,5000); } }

// ===================== PQR 기준 승인 범위 / 점검 =====================
// 규칙은 회사 자료에서 확인된 해석 (EN ISO 15614-1 Level 2 : 2017):  ※ 규격서 원문 확인 필요
//   맞대기 t≤3: 0.5t~2t / 필릿 t≤3: 0.7t~2t / 3<t≤12: 3~2t / t>12: 0.5t~2t / 레이저: 0.8t~1.2t
//   목 두께 0.75a~1.5a / 입열량 0.75~1.25배 / 모재 그룹 1.n → 1.1~1.n / 자세 ALL
const wt=x=>String(x||'').toUpperCase().replace(/^T-?BW$/,'T-BUTT'); // T-BW = T-BUTT
const numOf=t=>{ const m=String(t??'').match(/\d+(?:\.\d+)?/); return m?+m[0]:null; };
const r2=x=>Number(Number(x).toFixed(2));
function pqrApproval(p){
  const t=numOf(p.thickness), code=procCodesOf(p.process)[0]||'', fw=p.weldType==='FW', laser=/LBW/i.test(p.process)||['52','521','522'].includes(code), o={code,fw,notes:[]};
  if(/\+/.test(String(p.thickness||''))){ o.notes.push('이종 재료 조합(두께 A + B)은 자동 계산하지 않습니다'); return o; }
  if(t==null){ o.notes.push('PQR 시험 두께가 없어 범위를 계산할 수 없습니다'); return o; }
  let lo,hi;
  if(laser){ lo=.8*t; hi=1.2*t; o.rule='레이저: 0.8t ~ 1.2t'; }
  else if(t<=3){ lo=(fw?.7:.5)*t; hi=2*t; o.rule=fw?'t≤3 필릿: 0.7t ~ 2t':'t≤3 맞대기: 0.5t ~ 2t'; }
  else if(t<=12){ lo=3; hi=2*t; o.rule='3<t≤12: 3 ~ 2t'; }
  else { lo=.5*t; hi=2*t; o.rule='t>12: 0.5t ~ 2t'; }
  o.tMin=r2(lo); o.tMax=r2(hi); o.t=t;
  const a=fw?numOf(p.approval):null; if(a){ o.aMin=r2(.75*a); o.aMax=r2(1.5*a); o.a=a; }
  const gm=String(p.materialGroup||'').trim().match(/^1\.(\d)$/); o.group=gm?`1.1~1.${gm[1]}`:String(p.materialGroup||'').trim();
  o.pipe=fw?'N/A':'>500 or >150 welded in rotated PA'; o.position='ALL';
  const H=numOf(p.heat); if(H){ o.heatMin=r2(.75*H); o.heatMax=r2(1.25*H); }
  return o; }
function wpsPqrCheck(m){ // WPS 목록/양식이 연결된 PQR 승인 범위 안에 있는지, 목록과 양식이 서로 맞는지
  const w=[]; const ps=(m.pqrNos||[]).map(pqrFind).filter(Boolean);
  if(ps.length===1||ps.length===0&&false){ const p=ps[0], ap=pqrApproval(p);
    if(p.weldType==='FW'&&wt(m.weldType)==='BW') w.push(`FW 시험(${p.pqrNo})으로 BW WPS는 불가`);
    const pc=procCodesOf(p.process)[0]; if(pc&&(m.procCodes||[]).length&&!m.procCodes.includes(pc)) w.push(`공정 ${m.process} ≠ ${p.pqrNo} ${p.process}`);
    if(ap.tMin!=null&&m.thkMin!=null&&(m.thkMin<ap.tMin-1e-9||m.thkMax>ap.tMax+1e-9)) w.push(`두께 ${m.thk} 가 ${p.pqrNo}(${p.thickness}t) 승인범위 ${ap.tMin}~${ap.tMax} 초과`); }
  const f=m.form; if(f){ const fc=procCodesOf(f.processIso)[0]; if(fc&&(m.procCodes||[]).length&&!m.procCodes.includes(fc)) w.push(`목록 공정 ${m.process} ≠ 양식 ${f.processIso.split('[')[0].trim()}`);
    const ft=/fillet/i.test(f.jointType)?'FW':/t-?butt/i.test(f.jointType)?'T-BUTT':/butt/i.test(f.jointType)?'BW':''; if(ft&&m.weldType&&ft!==wt(m.weldType)) w.push(`목록 형식 ${m.weldType} ≠ 양식 ${f.jointType}`); }
  return w; }

function polyExt(poly,y){ const xs=[]; for(let i=0;i<poly.length;i++){ const a=poly[i], b=poly[(i+1)%poly.length]; if((a[1]<=y&&b[1]>y)||(b[1]<=y&&a[1]>y)) xs.push(a[0]+(y-a[1])*(b[0]-a[0])/(b[1]-a[1])); } return xs.length>=2?[Math.min(...xs),Math.max(...xs)]:null; }

// 용접 비드: 위로 볼록한 렌즈형(바닥은 이전 층/개선면에 융합되도록 넓게)
const beadPath=(x,y,rx,ry)=>`M${x-rx},${y+ry*.45} C${x-rx*.92},${y-ry*1.05} ${x+rx*.92},${y-ry*1.05} ${x+rx},${y+ry*.45} C${x+rx*.7},${y+ry*1.15} ${x-rx*.7},${y+ry*1.15} ${x-rx},${y+ry*.45} Z`;

  if(kind==='V') return `<polyline points="${sx-8},${sy+h} ${sx},${sy} ${sx+8},${sy+h}" ${st}/>`;
  if(kind==='bevel') return `<polyline points="${sx-6},${sy+h} ${sx-6},${sy} ${sx+7},${sy+h}" ${st}/>`;
  if(kind==='U') return `<path d="M${sx-8},${sy+h} L${sx-8},${sy+h*.35} A8,8 0 0 ${s<0?0:1} ${sx+8},${sy+h*.35} L${sx+8},${sy+h}" ${st}/>`;
  if(kind==='J') return `<path d="M${sx-7},${sy+h} L${sx-7},${sy+h*.3} M${sx-7},${sy+h*.3} A9,9 0 0 ${s<0?0:1} ${sx+8},${sy+h}" ${st}/>`;

// EN ISO 2553 : 기준선 체계 A(실선+점선 이중 기준선) / B(단일 기준선, AWS와 동일 배치)

//  B: 기준선 아래 = 화살표 쪽, 위 = 반대쪽
//  주 치수(z/a/s)는 기호 왼쪽, 길이·피치는 오른쪽. 꼬리에는 공정(ISO 4063)/품질등급(ISO 5817)/자세(ISO 6947)/충전재/WPS 참조를 '/'로 구분
function tailText(o){ return [o.tailProc,o.tailLvl?(o.tailLvlPrefix?'ISO 5817-'+o.tailLvl:o.tailLvl):'',o.tailPos,o.tailFiller,o.tailRef].map(x=>String(x||'').trim()).filter(Boolean).join('/'); }
function weldSymbol(o,kinds,anc,ref,bent){
  if(!o.symbol) return ''; const {x0,y,len}=ref, sx=x0+len*0.42, K='#000', side=o.symSide||'arrow', sys=o.symSystem||'A', both=side==='both', kind=kinds[0];
  const arrowD=bent?(()=>{ const bx=anc[0]+(x0-anc[0])*0.55, by=anc[1]-22; return `M${x0},${y} L${bx},${by} L${anc[0]},${anc[1]}`; })():`M${x0},${y} L${anc[0]},${anc[1]}`;
  let out=`<path d="${arrowD}" fill="none" stroke="${K}" stroke-width="1.3" stroke-linejoin="round" marker-end="url(#ah2)"/><line x1="${x0}" y1="${y}" x2="${x0+len}" y2="${y}" stroke="${K}" stroke-width="1.5"/>`;
  let bases=[]; // [기호 기준선 y, 방향 s]
  if(sys==='A'){ if(side==='arrow'){ out+=`<line x1="${x0}" y1="${y+3.5}" x2="${x0+len}" y2="${y+3.5}" stroke="${K}" stroke-width="1" stroke-dasharray="6 4"/>`; bases=[[y,-1]]; }
    else if(side==='other'){ out+=`<line x1="${x0}" y1="${y-3.5}" x2="${x0+len}" y2="${y-3.5}" stroke="${K}" stroke-width="1" stroke-dasharray="6 4"/>`; bases=[[y-3.5,-1]]; }
    else bases=[[y,-1],[y,1]]; }
  else { bases=both?[[y,-1],[y,1]]:side==='arrow'?[[y,1]]:[[y,-1]]; }
  for(const [by,s] of bases){ for(const k of kinds) out+=symGlyph(k,sx,by,s);
    const top=by+s*12; // 표면 형상 보조기호: 용접 기호 바깥쪽
    if(o.contour==='flush') out+=`<line x1="${sx-8}" y1="${top+s*4}" x2="${sx+8}" y2="${top+s*4}" stroke="${K}" stroke-width="1.4"/>`;
    else if(o.contour==='convex') out+=`<path d="M${sx-8},${top+s*3} Q${sx},${top+s*11} ${sx+8},${top+s*3}" fill="none" stroke="${K}" stroke-width="1.4"/>`;
    else if(o.contour==='concave') out+=`<path d="M${sx-8},${top+s*9} Q${sx},${top+s*1} ${sx+8},${top+s*9}" fill="none" stroke="${K}" stroke-width="1.4"/>`;
    let dim=''; if(kinds.includes('fillet')) dim=o.symDim==='a'?`a${r2(o.leg/Math.SQRT2)}`:`z${o.leg}`; else if(o.symS) dim=`s${o.symS}`;
    if(dim) out+=`<text x="${sx-13}" y="${by+s*7+4}" font-size="11" text-anchor="end" font-family="Arial" fill="${K}">${dmlEsc(dim)}</text>`;
    if(o.backing!=='none'&&['II','V','bevel','U','J'].includes(kind)){ const t=o.backing==='ceramic'?'MR':'M'; const ry=s<0?by-13:by+1; out+=`<rect x="${sx+16}" y="${ry}" width="${t.length*8+4}" height="12" fill="#fff" stroke="${K}" stroke-width="1"/><text x="${sx+18}" y="${ry+10}" font-size="10" font-family="Arial" fill="${K}">${t}</text>`; } }
  if(o.allAround) out+=`<circle cx="${x0}" cy="${y}" r="4.5" fill="#fff" stroke="${K}" stroke-width="1.2"/>`;
  if(o.field) out+=`<line x1="${x0}" y1="${y}" x2="${x0}" y2="${y-17}" stroke="${K}" stroke-width="1.2"/><polygon points="${x0},${y-17} ${x0+11},${y-12} ${x0},${y-7}" fill="${K}"/>`;
  const tx=x0+len; out+=`<polyline points="${tx+9},${y-8} ${tx},${y} ${tx+9},${y+8}" fill="none" stroke="${K}" stroke-width="1.3"/>`;
  const tt=tailText(o); if(tt) out+=`<text x="${tx+13}" y="${y+4}" font-size="10.5" font-family="Arial" fill="${K}">${dmlEsc(tt)}</text>`;
  return out; }
// ---------- 이음부 형상 생성 ----------
function genJoint(o,seq){
  const T=o.t, sc=Math.min(7,105/Math.max(T,1)), Tp=T*sc, cx=230, y0=78, Wd=175, tanH=Math.tan(o.angle/2*Math.PI/180), tanB=Math.tan(o.angle*Math.PI/180);
  const g=Math.max(o.gap*sc,o.gap>0?2:0), c=Math.min(o.face,T*0.9)*sc, d=Math.max(Tp-c,1), K='#000', type=o.type, xl=cx-g/2, xr=cx+g/2;
  let plates='', back='', dimsArr=[], polys=[], kinds=[], anc=[cx,y0], ref={x0:cx+58,y:34,len:105}, hatchOn=o.weld&&!seq;
  const P=pts=>pts.map(p=>p.join(',')).join(' ');
  const poly=pts=>`<polygon points="${P(pts)}" fill="#fff" stroke="${K}" stroke-width="1.6" stroke-linejoin="round"/>`;
  const wfill=pts=>hatchOn?`<polygon points="${P(pts)}" fill="url(#hatch)"/>`:'';
  const txt=(x,y,t,a='middle')=>`<text x="${x}" y="${y}" font-size="12" text-anchor="${a}" font-family="Malgun Gothic,Arial,sans-serif" fill="#000">${dmlEsc(t)}</text>`;
  const arrow=(x1,y1,x2,y2)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${K}" stroke-width="1" marker-end="url(#ah2)" marker-start="url(#ah2)"/>`;
  const dimV=(x,ya,yb,t)=>`<line x1="${x}" y1="${ya}" x2="${x+6}" y2="${ya}" stroke="${K}" stroke-width=".8"/><line x1="${x}" y1="${yb}" x2="${x+6}" y2="${yb}" stroke="${K}" stroke-width=".8"/>${arrow(x+3,ya,x+3,yb)}${txt(x-6,(ya+yb)/2+4,t,'end')}`;
  let weld='';
  if(type==='square'){ plates=poly([[xl-Wd,y0],[xl,y0],[xl,y0+Tp],[xl-Wd,y0+Tp]])+poly([[xr,y0],[xr+Wd,y0],[xr+Wd,y0+Tp],[xr,y0+Tp]]); const wp=[[xl,y0],[xr,y0],[xr,y0+Tp],[xl,y0+Tp]]; weld=g>0?wfill(wp):''; polys=[{pts:wp,crown:{a:[xl,y0],b:[xr,y0],nx:0,ny:-1,amt:Math.max(4,g*.5)}}]; kinds=['II']; }
  else if(type==='vgroove'||type==='xgroove'){ const both=type==='xgroove', d1=both?(Tp-c)/2:d, th=g/2+d1*tanH;
    const L=[[xl-Wd,y0],[cx-th,y0],[xl,y0+d1]], R=[[xr+Wd,y0],[cx+th,y0],[xr,y0+d1]];
    if(both){ L.push([xl,y0+d1+c],[cx-th,y0+Tp]); R.push([xr,y0+d1+c],[cx+th,y0+Tp]); } else { L.push([xl,y0+Tp]); R.push([xr,y0+Tp]); }
    L.push([xl-Wd,y0+Tp]); R.push([xr+Wd,y0+Tp]); plates=poly(L)+poly(R);
    const wp=both?[[cx-th,y0],[cx+th,y0],[xr,y0+d1],[xr,y0+d1+c],[cx+th,y0+Tp],[cx-th,y0+Tp],[xl,y0+d1+c],[xl,y0+d1]]:[[cx-th,y0],[cx+th,y0],[xr,y0+d],[xr,y0+Tp],[xl,y0+Tp],[xl,y0+d]];
    weld=wfill(wp); polys=[{pts:wp,crown:{a:[cx-th,y0],b:[cx+th,y0],nx:0,ny:-1,amt:Math.max(5,th*.28)}}]; kinds=['V'];
    if(both){ const m=y0+d1+c/2; polys=[{pts:[[cx-th,y0],[cx+th,y0],[xr,y0+d1],[xr,m],[xl,m],[xl,y0+d1]],crown:{a:[cx-th,y0],b:[cx+th,y0],nx:0,ny:-1,amt:Math.max(5,th*.24)}},
      {pts:[[xl,m],[xr,m],[xr,y0+d1+c],[cx+th,y0+Tp],[cx-th,y0+Tp],[xl,y0+d1+c]],crown:{a:[cx+th,y0+Tp],b:[cx-th,y0+Tp],nx:0,ny:1,amt:Math.max(5,th*.24)},down:true,cont:true}]; } }
  else if(type==='bevel'){ const th=d*tanB, xb=xr;
    plates=poly([[xl-Wd,y0],[xl,y0],[xl,y0+Tp],[xl-Wd,y0+Tp]])+poly([[xb+th,y0],[xb+Wd,y0],[xb+Wd,y0+Tp],[xb,y0+Tp],[xb,y0+d]]);
    const wp=[[xl,y0],[xb+th,y0],[xb,y0+d],[xb,y0+Tp],[xl,y0+Tp]]; weld=wfill(wp); polys=[{pts:wp,crown:{a:[xl,y0],b:[xb+th,y0],nx:0,ny:-1,amt:Math.max(5,(th+g)*.28)}}]; kinds=['bevel']; anc=[xl+(th+g)/2,y0]; }
  else if(type==='ugroove'){ const R=Math.min(o.r*sc,d*0.95), th0=Math.tan(Math.min(o.angle/2,25)*Math.PI/180), pyL=y0+d-R, pxL=xl-R, topx=pxL-(pyL-y0)*th0, pxR=xr+R, topxR=pxR+(pyL-y0)*th0;
    const Lp=`M${xl-Wd},${y0} L${topx},${y0} L${pxL},${pyL} A${R},${R} 0 0 0 ${xl},${y0+d} L${xl},${y0+Tp} L${xl-Wd},${y0+Tp} Z`, Rp=`M${xr+Wd},${y0} L${topxR},${y0} L${pxR},${pyL} A${R},${R} 0 0 1 ${xr},${y0+d} L${xr},${y0+Tp} L${xr+Wd},${y0+Tp} Z`;
    plates=`<path d="${Lp}" fill="#fff" stroke="${K}" stroke-width="1.6"/><path d="${Rp}" fill="#fff" stroke="${K}" stroke-width="1.6"/>`;

// ---- WPS 추천/일괄 지정
async function recommendWps(){
  if(!wpsMaster.length) return autoAssignWps();   // 마스터가 없으면 예전 방식(과거 기록의 조건 복사)
  const todo=records.map(r=>({r,sg:(r.wpsNo||'').trim()?null:suggestWps(r)})).filter(x=>x.sg);
  const none=records.filter(r=>!(r.wpsNo||'').trim()).length-todo.length;
  if(!todo.length) return alert(`추천할 수 있는 미지정 기록이 없습니다.${none?`\n(용접사 시험용 WPS 범위에 맞는 WPS가 없는 미지정 기록 ${none}건)`:''}`);
  const per=new Map(); todo.forEach(x=>per.set(x.sg.wpsNo,(per.get(x.sg.wpsNo)||0)+1));
  if(!confirm(`WPS가 비어 있는 기록 ${todo.length}건에 WPS 마스터의 '용접사 시험용(Welder Test)' WPS 중 시험 조건(형식·공정·자세·두께)에 맞는 것을 지정합니다.\n\n${[...per].sort((a,b)=>b[1]-a[1]).map(([w,n])=>`${w}: ${n}건`).join('\n')}\n\n맞는 WPS가 없어 미지정으로 남는 기록: ${none}건\n\n계속할까요?`)) return;
  await DB.putMany('records',todo.map(x=>({...x.r,wpsNo:x.sg.wpsNo}))); await load(); drawWps(); toast(`${todo.length}건에 WPS를 지정했습니다.`,5000); }
const wkey=r=>[r.process,r.joint,r.thickness,String(r.position).toUpperCase()].join('|');
async function autoAssignWps(){
  const m=new Map(); for(const r of records){ const k=(r.wpsNo||'').trim(); if(!k) continue; const key=wkey(r); if(!m.has(key)) m.set(key,new Set()); m.get(key).add(k); }
  const uniqMap=new Map([...m].filter(([,v])=>v.size===1).map(([k,v])=>[k,[...v][0]])), amb=[...m].filter(([,v])=>v.size>1).length;
  const todo=records.filter(r=>!(r.wpsNo||'').trim()&&uniqMap.has(wkey(r)));
  if(!todo.length) return alert('자동으로 채울 수 있는 미지정 기록이 없습니다. WPS 목록 엑셀을 먼저 가져오면 마스터 기준으로 추천할 수 있습니다.');
  const per=new Map(); todo.forEach(r=>{const w=uniqMap.get(wkey(r)); per.set(w,(per.get(w)||0)+1);});
  if(!confirm(`(WPS 마스터가 없어 과거 기록의 조건을 복사합니다)\n${todo.length}건:\n${[...per].map(([w,n])=>`${w}: ${n}건`).join('\n')}${amb?`\n조건에 WPS가 여러 개 섞여 제외: ${amb}종`:''}\n\n계속할까요?`)) return;
  await DB.putMany('records',todo.map(r=>({...r,wpsNo:uniqMap.get(wkey(r))}))); await load(); drawWps(); toast(`${todo.length}건에 WPS 번호를 채웠습니다.`,5000); }
function selWps(id,on){ on?WF.sel.add(id):WF.sel.delete(id); }
async function assignWps(){
  if(!WF.sel.size) return alert('WPS를 지정할 기록을 체크하세요.');
  const cur=uj(records.filter(r=>WF.sel.has(r.id)).map(r=>r.wpsNo),3);
  const v=prompt(`선택한 ${WF.sel.size}건의 WPS 번호를 입력하세요.\n(현재: ${cur||'미지정'} / 빈칸 = 지정 해제)\n등록된 WPS: ${wpsMaster.slice(0,8).map(m=>m.wpsNo).join(', ')}`,cur.split(',')[0]||'');
  if(v===null) return;
  await DB.putMany('records',records.filter(r=>WF.sel.has(r.id)).map(r=>({...r,wpsNo:v.trim()}))); WF.sel.clear(); await load(); drawWps(); toast('WPS 번호를 반영했습니다.',3000);
}

function condList(project){ // 해당 프로젝트에 등록된 시험 조건 조합 (자주 쓴 순)

// Reference No. = {접두어}-{용접사 순번}-{공정}-T{두께}-{유형}-{자세}
//   예) EN ISO 9606-1-RM-1-135-T12-BW-PC  (RM=Romansys, 1=용접사 번호 RM-WD-24001 의 끝 3자리 001)
//   순번: 번호 끝 3자리(기본) 또는 끝 숫자 전체(설정). 저장하지 않고 항상 계산하므로 번호 체계를 바꿔도 자동 반영된다.
function refSeq(w){ const m=String((w&&w.welderNo)||'').match(/(\d+)\s*$/); if(!m) return ''; const d=m[1];
  return parseInt(S.refSeqMode==='all'||d.length<=3?d:d.slice(-3),10); }
function refBase(c){ const w=welders.find(x=>x.id===c.welderId); return `${S.refPrefix}-${refSeq(w)}-${processCode(c.process)}-T${fmtN(c.thickness)}-${c.joint}-${String(c.position).toUpperCase()}`; }
function autoRef(c){ const base=refBase(c); // 같은 용접사·같은 조건에서 합격이 반복 발행(재시험/갱신)되면 -2, -3 …
  const earlier=records.filter(x=>x.id!==c.id&&x.welderId===c.welderId&&refBase(x)===base&&recStatus(x)==='pass'&&(x.weldingDate<c.weldingDate||(x.weldingDate===c.weldingDate&&x.id<(c.id||1e12)))).length;
  return earlier?`${base}-${earlier+1}`:base; }
const isAutoRef=t=>new RegExp('^'+String(S.refPrefix).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'-\\d+-\\d+-T[\\d.]+-(BW|FW)-[A-Z0-9-]+$','i').test(String(t||''));
function checkDupRefs(){ // 서로 다른 용접사가 같은 Reference No. 를 갖는지 (용접사 번호 체계 검토용)
  const m=new Map(); for(const r of records){ if(recStatus(r)!=='pass') continue; const k=r.refNo||autoRef(r); if(!m.has(k)) m.set(k,new Set()); m.get(k).add(r.welderId); }
  const dup=[...m].filter(([,v])=>v.size>1);
  alert(dup.length?`서로 다른 용접사가 같은 Reference No.를 쓰는 경우 ${dup.length}건:\n\n${dup.slice(0,12).map(([k,v])=>`${k}  (${[...v].map(id=>(welders.find(w=>w.id===id)||{}).welderNo).join(', ')})`).join('\n')}${dup.length>12?'\n…':''}\n\n용접사 번호 끝 3자리가 겹치는 경우입니다(예: 24001, 27001 → 둘 다 1). 번호 체계를 바꾸거나 설정에서 "끝 숫자 전체"를 쓰세요.`:'중복된 Reference No.가 없습니다.'); }
async function autoFixRef(){ // 예전에 저장된 자동 생성 번호(용접사별 기록 순번 방식)를 정리 -> 이후 규칙으로 항상 계산
  const t=records.filter(r=>r.refNo&&isAutoRef(r.refNo)); if(!t.length) return;
  const changed=t.filter(r=>autoRef({...r,refNo:''})!==r.refNo).length;
  await DB.putMany('records',t.map(r=>({...r,refNo:''}))); await load();
  toast(`Reference No. ${t.length}건을 규칙(용접사 번호 끝 3자리)으로 정리했습니다${changed?` — 그중 ${changed}건은 번호가 바뀌었습니다`:''}.`,8000); }

   <label style="flex-direction:row;align-items:center;gap:8px;margin-top:10px;color:var(--ink)"><input type="checkbox" name="impliedVT" ${S.impliedVT?'checked':''}>
   VT 자동 통과 처리: VT를 따로 기록하지 않아도 RT/UT·굽힘·단면 결과가 있으면 VT는 이미 통과한 것으로 간주 (입력·가져오기 시 적용)</label>
   <label style="flex-direction:row;align-items:center;gap:8px;margin-top:10px;color:var(--ink)"><input type="checkbox" name="strict" ${S.strict?'checked':''}>
   사내 엄격 기준 사용 (BW: VT+RT/UT+Bend 모두 Pass, FW: VT+Macro Pass). 해제 시 ISO 9606-1 Table 1 기준(BW: VT + RT/UT 또는 Bend/Fracture)</label>
   <div class="row"><button class="b">저장</button><button type="button" class="b sec" onclick="syncSettingsForm();sampleCert()">📄 샘플 인증서 미리보기 (현재 설정 반영)</button></div></form></div>
  <div class="card"><h2>데이터 점검</h2><button class="b sec" onclick="checkDupRefs()">Reference No. 중복 점검</button> <small style="color:var(--mute)">용접사 번호 체계(24001 vs 001)를 정할 때 참고: 서로 다른 용접사가 같은 번호를 쓰는지 확인합니다.</small></div>
  <div class="card"><h2>표시</h2><button class="b sec" onclick="resetWidths()">표 열 너비 초기화</button> <small style="color:var(--mute)">표 머리글 경계를 드래그해서 열 너비를 조절할 수 있습니다 (브라우저에 저장).</small></div>
  <div class="card"><h2>백업 / 복원</h2><div class="row"><button class="b" onclick="exportAll()">JSON 백업 다운로드</button>
   <input type="file" accept=".json" onchange="importAll(this.files[0])"><small style="color:var(--mute)">복원하면 현재 데이터가 모두 대체됩니다.</small></div>
   <p style="color:var(--mute)">데이터는 이 브라우저(IndexedDB)에만 저장됩니다. 브라우저 데이터를 지우면 사라지므로 주기적으로 백업하세요.</p></div>`;
  $('#sf').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target);
    for(const k of ['company','team','examiner','location','standardLabel','refPrefix','examBody','refSeqMode']) S[k]=fd.get(k);
    S.strict=fd.get('strict')==='on'; S.impliedVT=fd.get('impliedVT')==='on';
    await saveSettings(); vSettings(); alert('저장했습니다.');};
}
function exportAll(){download(`welder-backup-${today()}.json`,JSON.stringify({version:4,welders,records,settings:S,images,wps:wpsMaster,pqr:pqrMaster,joints}),'application/json');}
async function importAll(file){ if(!file) return; let d; try{d=JSON.parse(await file.text());}catch(e){return alert('JSON 형식이 아닙니다.');}
  if(!Array.isArray(d.welders)||!Array.isArray(d.records)) return alert('백업 파일 형식이 올바르지 않습니다.');
  if(!confirm('현재 데이터를 모두 지우고 복원할까요?')) return;
  await DB.clear('welders');await DB.clear('records');await DB.clear('settings');await DB.clear('images');await DB.clear('wps');await DB.clear('pqr');await DB.clear('joints');
  if(Array.isArray(d.joints)) await DB.putMany('joints',d.joints);
  if(Array.isArray(d.wps)) await DB.putMany('wps',d.wps); if(Array.isArray(d.pqr)) await DB.putMany('pqr',d.pqr);
  if(Array.isArray(d.images)) await DB.putMany('images',d.images.map(({id,...x})=>x));
  for(const w of d.welders) await DB.put('welders',w); for(const r of d.records) await DB.put('records',r);
  S={...DEFAULT_SETTINGS,...(d.settings||{})}; await saveSettings(); await load(); render(); }

async function autoFixNo(){ // 명단에 'RM-WD24028' 처럼 하이픈이 빠진 번호를 'RM-WD-24028' 형식으로 통일 (충돌 없을 때만)
  const all=new Set(welders.map(w=>w.welderNo)), fix=welders.filter(w=>normNo(w.welderNo)!==w.welderNo&&!all.has(normNo(w.welderNo)));
  if(!fix.length) return; await DB.putMany('welders',fix.map(w=>({...w,welderNo:normNo(w.welderNo)}))); await load();
  toast(`용접사 번호 형식 ${fix.length}건을 통일했습니다 (예: ${fix[0].welderNo} → ${normNo(fix[0].welderNo)}).`,7000); }
async function autoFixVT(){ // 앱을 열 때 1회: VT 미기록인데 다음 검사 결과가 있는 기록을 자동 보정 (설정에서 끌 수 있음)
  if(!S.impliedVT) return; const t=records.filter(r=>applyImpliedVT(r.tests||{})!==(r.tests||{})); if(!t.length) return;
  await DB.putMany('records',t.map(r=>({...r,tests:applyImpliedVT(r.tests||{})}))); await load();
  toast(`VT 미기록 ${t.length}건을 자동으로 통과 처리했습니다 (RT/UT·굽힘·단면 결과가 있는 기록). 설정에서 끌 수 있습니다.`,9000); }
DB.open().then(load).then(autoFixNo).then(autoFixRef).then(autoFixVT).then(render).catch(e=>{document.body.insertAdjacentHTML('beforeend','<div class="msg err">저장소를 열 수 없습니다: '+esc(e)+'</div>');});
</script>
</body>
</html>
