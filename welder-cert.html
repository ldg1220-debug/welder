<html lang="ko">
<head>

<title>용접사 자격 인증서 관리</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#1c2530;--mute:#6b7785;--line:#d5dbe1;--accent:#1f5fae;--ok:#1a7f4b;--bad:#c62828;--warn:#b7791f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif}
header{background:#14314f;color:#fff;padding:10px 20px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
header h1{font-size:16px;margin:0 12px 0 0}

main{max-width:1560px;margin:0 auto;padding:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:16px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
label{display:flex;flex-direction:column;font-size:12px;color:var(--mute);gap:3px}
input,select,textarea{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:5px;color:var(--ink);background:#fff}
button.b{background:var(--accent);color:#fff;border:0;padding:7px 14px;border-radius:5px;cursor:pointer;font:inherit}
button.b.sec{background:#e8edf2;color:var(--ink)}button.b.red{background:var(--bad)}button.b.sm{padding:3px 8px;font-size:12px}
table.list{width:100%;border-collapse:collapse}
table.list th,table.list td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;white-space:nowrap}
.tw{overflow-x:auto;max-height:70vh;overflow-y:auto;border:1px solid var(--line);border-radius:6px}
.tw table.list th{position:sticky;top:0;z-index:1}
table.list tbody tr:hover{background:#f5f8fb}

.wn{color:#b7791f;font-weight:700}
table.list tr.kid td{background:#f7f9fb;color:#5a6672;font-size:13px}table.list tr.kid td:first-child{border-left:3px solid #c9d3de}
.m{display:inline-block;width:20px;text-align:center;font-weight:700}.m.p{color:var(--ok)}.m.f{color:var(--bad)}.m.n{color:#b5bcc5}
td.num,th.num{text-align:center!important}
.bx{white-space:nowrap}
table.list td{overflow:hidden;text-overflow:ellipsis;max-width:0}
table.list td.bx{max-width:none}
table.list.measure td,table.list.nested td{max-width:none;overflow:visible}
table.list th{position:relative}
.rh{position:absolute;right:0;top:0;bottom:0;width:9px;cursor:col-resize;user-select:none;border-right:2px solid #c3ccd8}.stk{position:sticky!important;z-index:2;background:#fff}.tw table.list th.stk,th.stk{z-index:5!important;background:#eef2f6}tr:hover td.stk{background:#f5f8fb}tr.gone td.stk{background:#fdeeee}tr.kid td.stk{background:#f7f9fb}.stkl{box-shadow:2px 0 3px -1px rgba(0,0,0,.3)}.rh:hover,.rh:active{background:var(--accent);opacity:.5}
.pz{border:2px dashed var(--line);border-radius:6px;min-height:64px;padding:6px;display:flex;align-items:center;gap:8px;color:var(--mute);font-size:12px;cursor:pointer;background:#fafbfc}
.pz:focus,.pz.over{border-color:var(--accent);outline:0;background:#eef5fd;color:var(--accent)}
#genj [data-mv],#gens [data-mv]{cursor:move}#genj [data-mv]:hover,#gens [data-mv]:hover{filter:drop-shadow(0 0 2px #1f5fae)}table.mx{border-collapse:collapse;font-size:12px;white-space:nowrap}table.mx th,table.mx td{border:1px solid #c9d1da;padding:2px 5px;text-align:center}table.mx thead th{background:#fdf0cf;position:sticky;top:0;z-index:2}table.mx thead tr.h2 th{top:22px}table.mx thead tr.h3 th{top:44px}table.mx thead tr.h4 th{top:66px;background:#f3f3f3;font-weight:400;font-size:11px}table.mx td.l,table.mx th.l{background:#eef2f7;text-align:left}table.mx td.ok{background:#22e0e8;cursor:pointer}table.mx td.rn{background:#ffe27a;cursor:pointer}table.mx td.ex{background:#f3b6b6;cursor:pointer;color:#7a1f1f}table.mx td.pg{background:#ffd7a8}table.mx td.ft{color:#b33}table.mx tr.sep td{border-top:2px solid #333}table.mx tr.gone td{color:#8a94a0}#genj [data-ax=x]{cursor:ew-resize}#genj [data-ax=y],#gens [data-ax=y]{cursor:ns-resize}#genj [data-p]:hover rect{fill:#e07b00}
.lib{display:flex;gap:10px;flex-wrap:wrap}.li{position:relative;border:2px solid var(--line);border-radius:6px;padding:3px;background:repeating-conic-gradient(#eef0f2 0 25%,#fff 0 50%) 50%/12px 12px}
.li.on{border-color:var(--accent);box-shadow:0 0 0 2px #cfe0f3}.li img{height:52px;max-width:120px;cursor:pointer;display:block}
.li b{position:absolute;top:-9px;right:-9px;background:var(--bad);color:#fff;border-radius:50%;width:18px;height:18px;text-align:center;line-height:18px;font-size:12px;cursor:pointer}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#14314f;color:#fff;padding:10px 16px;border-radius:8px;max-width:80vw;z-index:50;display:none;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.pz img{max-height:52px;max-width:90px;border:1px solid var(--line);border-radius:3px;background:#fff}
table.list th{background:#eef2f6;font-size:12px}
.pill{white-space:nowrap;display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;color:#fff}
.pass{background:var(--ok)}.fail{background:var(--bad)}.pending{background:var(--warn)}
.stats{display:flex;gap:12px;flex-wrap:wrap}.stat{flex:1;min-width:150px;text-align:center}.stat b{display:block;font-size:26px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.range td{padding:4px 8px;border-bottom:1px solid var(--line)}
.rt{border:1px solid var(--line);border-radius:10px;margin:0 0 12px;overflow:hidden}.rt-head{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:10px 14px;background:#eef3f9}.rt-who b{font-size:17px}.rt-who small{color:var(--mute);margin-left:6px}.rt-cond{display:flex;gap:6px;flex:1;flex-wrap:wrap}.rt-cond span{background:#fff;border:1px solid #cfdae8;border-radius:6px;padding:2px 10px;font-size:13px}.rt-cond .rt-j{background:#1f5fae;color:#fff;border-color:#1f5fae;font-weight:700}.rt-list{padding:6px 10px}.rt-i{display:flex;gap:10px;align-items:center;padding:7px 10px;margin:4px 0;border-radius:8px;font-size:13.5px;border-left:5px solid #9aa7b5;background:#f6f8fa}.rt-i.s2{border-left-color:#c0392b;background:#fdf0ee}.rt-i.s1{border-left-color:#e0a000;background:#fff8e6}.rt-i .tx{flex:1;line-height:1.6}.rt-i .ic{font-size:16px}.rt-chip{background:#fff;border:1px solid #e6b8b0;color:#a8321f;border-radius:10px;padding:0 8px;font-size:12px;white-space:nowrap}.rt-ok{padding:10px 14px;color:var(--ok);font-weight:600}
.rg{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px}.rg th{background:#eef2f6;text-align:left;padding:8px 12px;font-size:12px;color:#44546a;border-bottom:2px solid #cfd8e3}.rg td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}.rg tbody tr:nth-child(even) td{background:#fafbfd}.rg td.lbl{font-weight:700;white-space:nowrap;width:150px}.rg td.tst{color:#44546a}.rg td.rng b{display:inline-block;background:#e8f1fb;color:#0b4f9c;border-radius:6px;padding:2px 10px;line-height:1.5}.rg td.src{color:var(--mute);font-size:12px}.rg tr.chk td{background:#fff8e6!important}.chk-b{background:#ffe9a8;color:#7a5200;border-radius:8px;padding:0 6px;font-size:11px;white-space:nowrap}
.chk{color:var(--warn);font-size:12px}
.msg{padding:8px 12px;border-radius:6px;margin:8px 0}.msg.err{background:#fdecea;color:var(--bad)}.msg.info{background:#eaf2fb}
.thumb{height:64px;border:1px solid var(--line);border-radius:4px}
.hide{display:none}
#modal{position:fixed;inset:0;background:#6b7785;overflow:auto;z-index:10}
#modal .bar{position:sticky;top:0;z-index:2;padding:8px 14px;background:#14314f;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#modal .tip{color:#cfe0f3;font-size:12px}#modal .tip b{color:#fff}
#modal .sheet{width:max-content;max-width:100%;margin:16px auto;background:#fff;box-shadow:0 4px 24px rgba(0,0,0,.4)}
/* ---- 인증서 (화면 미리보기 & 인쇄 공용) ---- */
.cert{margin-left:auto;margin-right:auto;width:210mm;height:296.5mm;overflow:hidden;padding:6mm 9mm;background:#fff;color:#000;font:9pt/1.35 "Malgun Gothic",Arial,sans-serif;position:relative;box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.cert table{width:100%;border-collapse:collapse}.cert td,.cert th{border:1px solid #000;padding:1.5px 4px;vertical-align:middle}
.cert th{font-size:9pt}.cert .sm{font-size:7pt}
.cert .top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:5mm;margin-bottom:2mm}
.cert .co{justify-self:start;font-weight:700;font-size:13pt}.cert .co img{max-height:16mm;max-width:52mm;display:block}
.cert .ti{text-align:center}.cert .ti b{display:block;font-size:14pt}.cert .ti span{font-size:12pt;font-weight:700}
.cert .tm{justify-self:end;min-width:34mm;max-width:52mm;border:1px solid #000;text-align:center;padding:2mm 3mm}.cert .tm b{display:block;font-size:13pt}.cert .tm span{font-size:8pt;font-weight:700}
.cert .val{color:#1a33d6;font-weight:700}.cert .c{text-align:center;font-weight:700}
.cert .ln{margin:.8mm 0}.cert .two{display:flex;justify-content:space-between;gap:6mm}.cert .two>div:first-child{flex:1}
.cert .info{display:flex;gap:4mm;margin-bottom:2.5mm}.cert .lf{flex:1.35}.cert .rf{flex:1}.cert .rf .phb{margin-top:1.5mm}
.cert .phb{width:34mm;margin-left:0}.cert .phb td{height:38mm;text-align:center;padding:0}.cert .en{color:#1a33d6;font-weight:700;padding-top:1mm}
.cert img.photo{width:33mm;height:37mm;object-fit:cover;display:block;margin:0 auto}
.cert .rng th{background:#fff}.cert .rng td{height:6.3mm;padding-top:0;padding-bottom:0}.cert .rng td:first-child{width:30%}
.cert .lb{text-align:center;line-height:1.1}.cert .lb b{display:block;font-size:9pt}.cert .lb i{display:block;font-size:6.5pt;font-style:normal;font-weight:700}
.cert .bot{display:flex;gap:6mm;margin-top:1mm}.cert .tt{width:45%}.cert .tt td,.cert .tt th{height:5.8mm;padding-top:0;padding-bottom:0}.cert .lb1 i{font-size:7pt;font-style:normal;font-weight:700}
.cert .mk{color:#d10000;font-weight:700;font-size:11pt}
.cert .rt{flex:1;position:relative}.cert .sigbox{position:absolute;right:0;top:3mm;width:44mm;height:19mm}
.cert .sigbox .stamp{position:absolute;left:0;top:0;height:18mm;opacity:.92}.cert .sigbox .sign{position:absolute;left:21mm;top:2mm;height:14mm;max-width:23mm}
.cert .prol{display:flex;gap:4mm;margin-top:1.5mm}.cert .prol table{flex:1}
.wdoc{width:210mm;min-height:297mm;padding:8mm 9mm;background:#fff;color:#000;font:8.6pt/1.35 "Malgun Gothic",Arial,sans-serif;box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.wdoc table{width:100%;border-collapse:collapse;margin-bottom:2mm}.wdoc td,.wdoc th{border:1px solid #000;padding:1.5mm 2mm;vertical-align:top}.wdoc th{background:#f2f2f2;font-size:8.5pt}
.wdoc .wh{display:flex;justify-content:space-between;align-items:center;border:1px solid #000;padding:2mm 4mm;margin-bottom:2mm}.wdoc .wt b{display:block;font-size:15pt}.wdoc .wt span{font-size:10pt;font-weight:700}
.wdoc .wc{text-align:right;font-weight:700}.wdoc .wc img{max-height:13mm;display:block;margin-left:auto}.wdoc .wl{margin:.6mm 0}.wdoc .val{color:#1a33d6;font-weight:700}
.wdoc .sk{height:50mm;text-align:center;vertical-align:middle;width:50%}.wdoc .sk img{max-height:48mm;max-width:100%}.wdoc .wh3 td{text-align:center;vertical-align:middle;height:16mm}.wdoc .wh3 .wlg{width:27%}.wdoc .wh3 .wlg img{max-height:13mm;max-width:100%}.wdoc .wh3 .wtt{width:46%}.wdoc .wh3 .wtt b{font-size:15pt}.wdoc .wh3 .wtt span{font-size:12pt;font-weight:700}.wdoc .wh3 .wrv{width:27%;font-size:11pt}.skm,#skm{position:fixed;inset:0;background:rgba(15,25,40,.6);z-index:99997;display:flex;align-items:center;justify-content:center}#skm .skwin{background:#fff;border-radius:10px;width:min(1500px,97vw);height:94vh;display:flex;flex-direction:column;padding:8px}#skm .skbar{margin:0 0 6px;flex-wrap:wrap;gap:4px;align-items:center}#skm .skmain{flex:1;display:flex;gap:10px;min-height:0}#skcv{flex:1;overflow:auto;position:relative;border:1px solid var(--line);background:#fafafa}#skside{width:300px;overflow:auto;font-size:13px;padding-right:4px}#skside .skh{font-weight:700;margin:6px 0 2px;font-size:12px;color:var(--mute)}.wdoc .wcap{font-weight:700;font-size:9.5pt;margin:3mm 0 1mm}.wdoc .ws{border:1.5px solid #000}.wdoc .ws th{background:#b9ecde;font-size:11pt;line-height:1.3;padding:1.6mm}.wdoc .wp th{background:#b9ecde;font-size:8.6pt;line-height:1.3;vertical-align:middle}.wdoc .wp td{vertical-align:middle}.wdoc .wp td{text-align:center;height:6mm;padding:.5mm 1mm}.wdoc .wsig{position:relative;margin-top:6mm;min-height:24mm;text-align:left;padding-left:2mm}

.cert+.cert,.wdoc+.wdoc{margin-top:14px}
#libpick{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30;overflow:auto;padding:24px}.libwin{background:#fff;border-radius:10px;padding:16px;max-width:1100px;margin:0 auto}
.libg{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}.lc{border:1px solid var(--line);border-radius:8px;padding:8px;background:#fff}.lt{height:130px;background:#fff;border:1px solid #eee}.lt img{width:100%;height:100%;object-fit:contain}
.ln2{display:flex;flex-direction:column;margin-top:4px}.ln2 b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ln2 small{color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cert .wm{position:absolute;left:0;right:0;top:105mm;text-align:center;font-size:40pt;font-weight:900;color:rgba(200,0,0,.14);transform:rotate(-22deg);pointer-events:none;z-index:3}

/* ---- 레이아웃 공통 (v93) ---- */
.b:not(button){display:inline-block;background:var(--accent);color:#fff;border:0;padding:7px 14px;border-radius:5px;cursor:pointer;font-size:14px;line-height:1.45;user-select:none}.b.sec:not(button){background:#e8edf2;color:var(--ink)}.b.sm:not(button){padding:3px 8px;font-size:12px}.b:not(button):hover{filter:brightness(.96)}
.grid{gap:12px 14px}
.grid.sm{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.grid>label{justify-content:flex-start}

label.ck{flex-direction:row!important;align-items:center;gap:6px;color:var(--ink);font-size:13px;align-self:end;min-height:31px;cursor:pointer}
.gh{font-size:13px;font-weight:700;color:#24364a;margin:18px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--line)}
.gh:first-child{margin-top:2px}
.gs{font-size:12px;font-weight:600;color:var(--mute);margin:10px 0 4px}
.hint{font-size:12px;color:var(--mute);margin:6px 0}
.lbl{font-size:12px;color:var(--mute);margin-bottom:3px}
.genform{min-width:0}.genlay{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:22px;align-items:start}
.genprev{position:sticky;top:10px}

.pvh{font-size:12px;padding:4px 8px;color:var(--mute);border-bottom:1px solid #eef1f4}
.pvb{aspect-ratio:520/290;width:100%}
@media(max-width:1100px){.genlay{grid-template-columns:minmax(0,1fr)}.genprev{position:static}}
.seg{display:inline-flex;background:#e3e9ef;border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 14px;border-radius:7px;cursor:pointer;font:inherit;color:#44546a;white-space:nowrap}
.seg button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.14)}
.vh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.tb{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

<body>
<header>
  <h1>🔧 용접사 자격 인증서 관리 <span style="font-weight:400;font-size:12px;opacity:.7">ISO 9606-1</span> <button type="button" id="rfbtn" title="다른 창에서 바꾼 내용까지 포함해 데이터를 다시 불러옵니다" onclick="refreshData(true)" style="background:#2a5a8a;color:#fff;border:0;border-radius:8px;padding:2px 8px;cursor:pointer;font-size:12px">↻ 새로고침</button> <span id="ver" title="이 화면이 최신이 아니면 파일을 다시 받아 교체하세요" style="font-weight:400;font-size:11px;background:#2a5a8a;border-radius:8px;padding:1px 8px;margin-left:6px">v117 · 이면비드도 점 편집</span></h1>

</header>
<main id="view"></main>
<div id="modal" class="hide"><div class="bar">
  <span id="pgsw" style="display:inline-flex;gap:4px"></span><button class="b" onclick="window.print()">🖨 인쇄 / PDF로 저장</button>

  <span class="tip">열리는 인쇄 창에서 <b>대상 → "PDF로 저장"</b> 선택 → 용지 <b>A4</b> · 여백 <b>없음</b> · <b>배경 그래픽</b> 체크 → 저장</span></div>
  <div class="sheet"><div id="modalBody"></div></div></div>

<script>
/*ENGINE-START*/
// ===================== ISO 9606-1 규격 엔진 (DOM 미사용, 순수 함수) =====================
// confidence: 'high' = 샘플 인증서/규격 조항으로 확신, 'check' = 규격서 원문(표) 대조 필요
const STD = 'ISO 9606-1';
const INF = Infinity;
function fmtN(n){ return String(Number(Number(n).toFixed(2))); }
function pd(s){ const [y,m,d]=String(s).slice(0,10).split('-').map(Number); return new Date(Date.UTC(y,m-1,d)); }
function iso(dt){ return dt.toISOString().slice(0,10); }

// 9.3 a) : 유효기간 = 용접일 + 3년 - 1일
function calcExpire(weldingDate){
  const d=pd(weldingDate), y=d.getUTCFullYear()+3, m=d.getUTCMonth(), day=d.getUTCDate();
  let e=new Date(Date.UTC(y,m,day));
  if(e.getUTCMonth()!==m) e=new Date(Date.UTC(y,m+1,0)); // 2/29 -> 2/28
  return iso(new Date(e.getTime()-86400000));
}
function addDays(d,n){ const x=pd(d); x.setUTCDate(x.getUTCDate()+n); return iso(x); }
function defaultIssue(weldingDate){ return addDays(weldingDate,14); } // 발행일 미입력 시: 용접일 + 2주
function validityText(w,e){ return `${w} ~ ${e} (refer to 9.3 a)`; }
function monthsBetween(a,b){ // 꽉 찬 개월 수
  const s=pd(a), e=pd(b); let m=(e.getUTCFullYear()-s.getUTCFullYear())*12+e.getUTCMonth()-s.getUTCMonth();
  const last=new Date(Date.UTC(e.getUTCFullYear(),e.getUTCMonth()+1,0)).getUTCDate();
  if(e.getUTCDate()<Math.min(s.getUTCDate(),last)) m--; return Math.max(m,0);
}
// 상태: expired(적색) / renewal(황색: 경과개월 > 갱신횟수*6+6) / null
function certAlert(weldingDate, expireDate, renewalCount, today){
  if(today>expireDate) return 'expired';
  if(monthsBetween(weldingDate,today) > renewalCount*6+6) return 'renewal';
  return null;
}

// 합/불 판정. 기본은 ISO 9606-1 Table 1 (BW: VT + [RT/UT 또는 굽힘/파단], FW: VT + [Macro 또는 파단]).
// companyStrict=true 이면 사내 기준(BW: VT+RT/UT+Bend, FW: VT+Macro 모두).
function judge(joint, t, companyStrict){
  const v=k=>t[k]||'na';
  const all=['vt','rtut','bend','macro','fracture','additional'].map(v);
  if(all.includes('fail')) return 'fail';
  if(joint==='BW'){
    if(v('vt')!=='pass') return 'pending';
    if(companyStrict) return (v('rtut')==='pass'&&v('bend')==='pass')?'pass':'pending';
    return (v('rtut')==='pass'||v('bend')==='pass'||v('fracture')==='pass')?'pass':'pending';
  }
  if(v('vt')!=='pass') return 'pending';
  if(companyStrict) return v('macro')==='pass'?'pass':'pending';
  return (v('macro')==='pass'||v('fracture')==='pass')?'pass':'pending';
}

// VT는 RT/UT·굽힘·단면 시험보다 먼저 수행하므로, 다음 단계 결과(Pass/Fail)가 있으면 VT는 통과한 것으로 본다.
// VT에 Fail이 명시된 경우는 그대로 둔다.
function applyImpliedVT(t){ const v=k=>t[k]||'na'; if(v('vt')!=='na') return t;
  return ['rtut','bend','macro','fracture','additional'].some(k=>v(k)==='pass'||v(k)==='fail')?{...t,vt:'pass'}:t; }

const POS_BW={PA:['PA'],PC:['PA','PC'],PE:['PA','PC','PD','PE'],PF:['PA','PF'],PG:['PG']};
const POS_FW={PA:['PA'],PB:['PA','PB'],PC:['PA','PB','PC'],PD:['PA','PB','PD'],PF:['PA','PB','PF'],PG:['PG']};
const POS_HIGH={BW:['PA','PC','PF'],FW:[]}; // 샘플/확신 있는 항목
const FILLER_GRP={FM1:['FM1','FM2'],FM2:['FM2']};
const FILLER_TYPE={S:['S','M'],M:['M'],B:['B']};
const BACKING={'ss nb':['ss nb','ss mb','bs'],'ss mb':['ss mb'],'bs':['bs'],'N/A':['N/A']};

function thicknessRange(joint,t){
  if(!(t>0)) return null;
  if(joint==='BW'){
    if(t<3)  return {lo:t,hi:2*t};
    if(t<12) return {lo:3,hi:2*t};
    return {lo:3,hi:INF};
  }
  return t<3?{lo:t,hi:2*t}:{lo:3,hi:INF}; // FW
}
function rangeText(r,sym){ if(!r) return '-'; if(r.hi===INF) return sym==='t'?`≥ ${r.lo.toFixed(1)}`:`${fmtN(r.lo)} ≤ ${sym}`; return `${fmtN(r.lo)} ≤ ${sym} ≤ ${fmtN(r.hi)}`; } // 양식: 두께 '≥ 3.0', 용접두께 '3 ≤ s'
function processCode(p){ return String(p||'').trim().split(/\s+/)[0]; }

// input: {process,productType:'P'|'T',pipeDiameter,joint:'BW'|'FW',transfer,fillerGroup,fillerType,fillerDesignation,
//        gas,backing,thickness,deposited,position,weldingDate}
function calculateRangeOfApproval(input, standard){
  standard = standard||STD;
  if(standard!==STD) return {manual_review_required:true, warnings:[`규격 ${standard} 미지원`], items:[]};
  const i=input, W=[], items=[]; let manual=false;
  const add=(key,label,test,range,source,confidence)=>{ items.push({key,label,test,range,source,confidence:confidence||'high'}); };
  const j=i.joint, code=processCode(i.process), t=Number(i.thickness), s=Number(i.deposited||i.thickness);

  add('process','용접방법 Welding process',i.process,i.process,'ISO 9606-1 5.2 / Table 5');
  if(!['135','136','138','141','121','111','114','131','311'].includes(code)) W.push(`공정 ${code}: 규격서 확인 필요`);
  if(code==='311'){ manual=true; W.push('311(가스용접)은 두께 범위 규칙이 달라 자동 산출 불가 → 수동 검토'); }

  // 제품 형태
  if(i.productType==='T'){
    const D=Number(i.pipeDiameter);
    let rng; if(!(D>0)) {rng='-'; W.push('관 외경(D) 미입력');} else rng = D<=25?`${fmtN(D)} ≤ D ≤ ${fmtN(2*D)}`:`D ≥ ${fmtN(Math.max(0.5*D,25))}`;
    add('product','판재 또는 파이프 Plate or pipe','T','T, P','ISO 9606-1 Table 6','check');
    add('diameter','파이프 직경 Pipe diameter',D>0?fmtN(D):'-',rng,'ISO 9606-1 Table 6','check');
  }else{
    add('product','판재 또는 파이프 Plate or pipe','P','P, T (F:D≥500mm / R:D≥75mm)','ISO 9606-1 Table 6 (샘플 인증서)');
    add('diameter','파이프 직경 Pipe diameter','N/A','N/A','ISO 9606-1 Table 6');
  }
  add('joint','용접 유형 Type of Weld',j,j,'ISO 9606-1 Table 7 / 5.4','check');
  if(j==='FW') W.push('필릿 시험은 맞대기 자격과 별개 (규격서 확인)');

  // 이행 모드(GMAW 계열만)
  if(/^13/.test(code)){
    const tr=i.transfer||'globular/spray';
    const rng=tr==='short'?'Short circuit':tr==='pulsed'?'Pulsed':'Globular or Spray';
    add('transfer','용접 이행 Transfer mode',tr==='globular/spray'?'Globular or Spray':tr==='short'?'Short circuit':'Pulsed',rng,'ISO 9606-1 5.3(샘플 인증서)', tr==='globular/spray'?'high':'check');
  }else add('transfer','용접 이행 Transfer mode','-','-','—');

  add('material','모재 그룹 Material Group',i.materialGroup||'-','-','ISO 9606-1 (샘플 인증서)','check');
  // 용가재
  const fg=String(i.fillerGroup||'').replace(/\s/g,'');
  if(FILLER_GRP[fg]) add('fillerGroup','용가재 그룹 Filler material group',fg,FILLER_GRP[fg].join(', '),'ISO 9606-1 Table 3', fg==='FM1'?'high':'check');
  else if(fg){ manual=true; W.push(`용가재 그룹 ${fg}: Table 3 수동 확인 필요`); add('fillerGroup','용가재 그룹 Filler material group',fg,'수동 확인','ISO 9606-1 Table 3','check'); }
  const ft=i.fillerType||'S';
  add('fillerType','용가재 종류 Filler material designation',ft,(FILLER_TYPE[ft]||[ft]).join(', '),'ISO 9606-1 Table 4', ft==='S'?'high':'check');
  add('gas','보호가스 Shielding gas',i.gas||'-',i.gas?'Similar shielding gas':'-','ISO 9606-1 Table 5');

  // 백킹/이면 처리
  const bk=i.backing||'N/A';
  add('backing','가우징/배킹 Gouging/Backing','N/A','N/A','양식(샘플 인증서)'); // ss nb/ss mb 는 아래 '기타 Weld details' 행에 표기

  // 두께
  const tr=thicknessRange(j,t), sr=thicknessRange(j,s);
  add('thickness','시험재 두께 Material Thickness',fmtN(t),rangeText(tr,'t'),'ISO 9606-1 Table 8', 'high');
  add('deposited','용접 두께 Deposited Thickness',fmtN(s),rangeText(sr,'s'),'ISO 9606-1 Table 8', 'high');

  // 용접 자세
  const posTable=j==='BW'?POS_BW:POS_FW, pos=String(i.position||'').toUpperCase();
  if(posTable[pos]) add('position','용접자세 Welding Position',pos,posTable[pos].join(', '),'ISO 9606-1 Table 9', (POS_HIGH[j]||[]).includes(pos)?'high':'check');
  else { manual=true; W.push(`자세 ${pos||'(미입력)'}: 자동 산출표에 없음 → 수동 검토`); add('position','용접자세 Welding Position',pos||'-','수동 확인','ISO 9606-1 Table 9','check'); }

  add('details','기타 Weld details',j==='BW'?bk:'-', j==='BW'?(BACKING[bk]||[bk]).join(', '):'-','ISO 9606-1 Table 7', bk==='ss nb'?'high':'check');
  return {items, warnings:W, manual_review_required:manual, expire: i.weldingDate?calcExpire(i.weldingDate):null};
}

function designation(i){
  const code=processCode(i.process), fm=String(i.fillerGroup||'').replace(/\s/g,'');
  const parts=['EN ISO 9606-1',code,i.productType||'P',i.joint,fm,i.fillerType||'S',`t${fmtN(i.thickness)}`,i.position];
  if(i.joint==='BW') parts.push('ss '+(/mb|ceramic/i.test(i.backing||'')?'mb':'nb'));
  return parts.filter(Boolean).join(' ');
}
/*ENGINE-END*/
</script>
<script>
// ===================== 저장소 (IndexedDB) =====================
// ---- 여러 브라우저 탭/창에서 같은 앱을 열어 둔 경우 변경 사항을 서로 알려 자동으로 새로 불러온다
const TAB_ID=Math.random().toString(36).slice(2), BC=('BroadcastChannel' in window)?new BroadcastChannel('welder-cert-sync'):null; let _annT=null, _seenSync='';
function announceChange(){ clearTimeout(_annT); _annT=setTimeout(()=>{ const v=TAB_ID+':'+Date.now(); _seenSync=v; try{ BC&&BC.postMessage({id:TAB_ID}); }catch(e){} try{ localStorage.setItem('welder-sync',v); }catch(e){} },150); }
// ---- 서버 모드: server.js 로 접속(http)하면 데이터를 서버에 저장·조회. 파일을 직접 열면(file://) 기존처럼 이 브라우저(IndexedDB)에 저장.
const REMOTE={on:false,role:'master',user:'',v:0}, RO=()=>REMOTE.on&&REMOTE.role!=='master';
async function rapi(path,body){ const r=await fetch(path,body===undefined?{credentials:'same-origin'}:{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-Requested-With':'welder'},body:JSON.stringify(body)}); let j=null; try{ j=await r.json(); }catch(e){}
  if(r.status===401&&path!=='/api/login'){ await remoteLogin(); return rapi(path,body); }
  if(!r.ok) throw new Error((j&&j.error)||('서버 오류 '+r.status)); if(j&&j.v) REMOTE.v=j.v; return j; }
function remoteLogin(msg){ return new Promise(ok=>{ document.getElementById('rlg')?.remove(); const d=document.createElement('div'); d.id='rlg'; d.style.cssText='position:fixed;inset:0;z-index:999999;background:rgba(20,49,79,.92);display:flex;align-items:center;justify-content:center';
  d.innerHTML=`<form style="background:#fff;border-radius:12px;padding:26px 28px;width:min(340px,92vw);display:flex;flex-direction:column;gap:10px"><h2 style="margin:0">🔧 용접사 자격 인증서 관리</h2><div style="color:#c0392b;font-size:13px;min-height:18px" id="rlge">${msg||''}</div><label>아이디<input name="user" autocomplete="username" required></label><label>비밀번호<input name="pass" type="password" autocomplete="current-password" required></label><button class="b">로그인</button><small style="color:#667">계정은 마스터에게 문의하세요.</small></form>`; document.body.appendChild(d);
  const f=d.querySelector('form'); f.user.focus(); f.onsubmit=async e=>{ e.preventDefault(); try{ const j=await rapi('/api/login',{user:f.user.value.trim(),pass:f.pass.value}); REMOTE.user=j.user; REMOTE.role=j.role; d.remove(); ok(); }catch(err){ d.querySelector('#rlge').textContent=err.message; f.pass.value=''; f.pass.focus(); } }; }); }
function roBlock(){ toast('조회 전용 계정은 수정할 수 없습니다. (내려받기·인쇄는 가능)',3500); throw new Error('조회 전용 계정은 수정할 수 없습니다.'); }
const DB={db:null,
  async openRemote(){ let h=null; try{ const r=await fetch('/api/hello'); if(r.ok) h=await r.json(); }catch(e){} if(!h||!h.server) return false;
    REMOTE.on=true; if(h.needSetup){ document.body.insertAdjacentHTML('beforeend','<div class="msg err">서버에 마스터 계정이 없습니다. 서버 PC에서 server.js 를 다시 실행해 마스터 계정을 만드세요.</div>'); }
    const r=await fetch('/api/me',{credentials:'same-origin'}); if(r.ok){ const j=await r.json(); REMOTE.user=j.user; REMOTE.role=j.role; REMOTE.v=j.v; } else await remoteLogin();
    document.body.classList.toggle('ro',RO()); remoteBadge(); setInterval(remotePoll,8000); return true; },
  open(){ return (/^https?:$/.test(location.protocol)?this.openRemote():Promise.resolve(false)).then(rem=>{ if(rem) return; return this.openLocal(); }); },
  openLocal(){return new Promise((res,rej)=>{const r=indexedDB.open('welder-cert',4);
    r.onupgradeneeded=e=>{const d=e.target.result, has=n=>d.objectStoreNames.contains(n);
      if(!has('welders')) d.createObjectStore('welders',{keyPath:'id',autoIncrement:true});
      if(!has('records')) d.createObjectStore('records',{keyPath:'id',autoIncrement:true});
      if(!has('settings')) d.createObjectStore('settings',{keyPath:'key'});
      if(!has('images')) d.createObjectStore('images',{keyPath:'id',autoIncrement:true});
      if(!has('wps')) d.createObjectStore('wps',{keyPath:'id',autoIncrement:true});
      if(!has('pqr')) d.createObjectStore('pqr',{keyPath:'id',autoIncrement:true});
      if(!has('joints')) d.createObjectStore('joints',{keyPath:'id',autoIncrement:true});};
    r.onsuccess=e=>{this.db=e.target.result;res()};r.onerror=()=>rej(r.error);});},
  tx(s,m,f){ if(REMOTE.on) throw new Error('remote'); return new Promise((res,rej)=>{const t=this.db.transaction(s,m);const q=f(t.objectStore(s));t.oncomplete=()=>{ if(m==='readwrite') announceChange(); res(q&&q.result); };t.onerror=()=>rej(t.error);});},
  all(s){ if(REMOTE.on) return rapi('/api/all/'+s); return this.tx(s,'readonly',o=>o.getAll());},
  async put(s,v){ if(REMOTE.on){ if(RO()) roBlock(); return (await rapi('/api/put/'+s,v)).id; } return this.tx(s,'readwrite',o=>o.put(v));},
  async putMany(s,arr){ if(REMOTE.on){ if(RO()) roBlock(); const ids=[]; for(let i=0;i<arr.length;i+=100) ids.push(...(await rapi('/api/putMany/'+s,arr.slice(i,i+100))).ids); return ids; } return this.putManyLocal(s,arr); },
  putManyLocal(s,arr){return new Promise((res,rej)=>{const t=this.db.transaction(s,'readwrite');const o=t.objectStore(s);const ids=[];arr.forEach((v,i)=>{const q=o.put(v);q.onsuccess=()=>ids[i]=q.result;});t.oncomplete=()=>{ announceChange(); res(ids); };t.onerror=()=>rej(t.error);});},
  async del(s,id){ if(REMOTE.on){ if(RO()) roBlock(); await rapi('/api/del/'+s+'/'+encodeURIComponent(id),{}); return; } return this.tx(s,'readwrite',o=>o.delete(id));},
  async clear(s){ if(REMOTE.on){ if(RO()) roBlock(); await rapi('/api/clear/'+s,{}); return; } return this.tx(s,'readwrite',o=>o.clear());}
};

const cfSort=(a,b)=>{ const na=parseFloat(a), nb=parseFloat(b); if(!isNaN(na)&&!isNaN(nb)&&/^[\d.\-]+$/.test(a)&&/^[\d.\-]+$/.test(b)) return na-nb; return String(a).localeCompare(String(b),'ko',{numeric:true}); };

  document.body.appendChild(p); const r=e.target.getBoundingClientRect(); p.style.left=Math.max(6,Math.min(innerWidth-264,r.left))+'px'; p.style.top=Math.max(8,Math.min(r.bottom+4,innerHeight-p.offsetHeight-8))+'px'; p.querySelector('.cfs').focus(); }

function jointMismatchPlan(){ const plan={del:[],fix:[]};

  return plan; }
async function jointMismatchApply(){ const pl=jointMismatchPlan(), n=pl.del.length+pl.fix.length; if(!n) return toast('정리할 기록이 없습니다.',2500); const wn=r=>(welders.find(w=>w.id===r.welderId)||{}).name;

  for(const {r,q} of pl.del){ if(r.wpsNo&&!(q.wpsNo||'').trim()&&processCode(q.process)===processCode(r.process)) await DB.put('records',{...q,wpsNo:r.wpsNo,issueDate:q.issueDate||r.issueDate||''}); await DB.del('records',r.id); }
  if(pl.fix.length) await DB.putMany('records',pl.fix.map(({r,want})=>({...r,joint:want,backing:want==='FW'?'N/A':r.backing,tests:applyImpliedVT(r.tests||{})}))); await load(); render(); toast(`삭제 ${pl.del.length}건 · 수정 ${pl.fix.length}건 정리했습니다.`,5000); }
const missTests=r=>{ const T=r.tests||{}, L=[]; if(T.vt!=='pass') L.push('VT'); if(r.joint==='BW'){ if(S.strict?T.rtut!=='pass':(T.rtut!=='pass'&&T.fracture!=='pass')) L.push('RT/UT'); if(S.strict?T.bend!=='pass':(T.bend!=='pass'&&T.fracture!=='pass'&&T.rtut!=='pass')) L.push('Bend'); } else if(S.strict?T.macro!=='pass':(T.macro!=='pass'&&T.fracture!=='pass')) L.push('Macro'); return L.join('·'); };
function dataAudit(showIgn){ const wm=new Map(welders.map(w=>[w.id,w])), nm=r=>{ const w=wm.get(r.welderId)||{}; return `${w.name||'?'} ${r.weldingDate} ${r.process} ${r.joint} t${fmtN(r.thickness)} ${r.position}`; }, out=[], R=records.filter(r=>{ const w=wm.get(r.welderId); return !(w&&w.status==='미입사'); });

  { const pl=jointMismatchPlan(); out.push({k:'joint',sev:2,t:'이음(BW/FW)과 시험 항목이 안 맞는 기록',hint:'인증서 설계명의 BW/FW 오타로 만들어진 기록입니다. 아래 버튼으로 중복은 삭제하고 나머지는 이음 형식을 고칩니다.',action:`<button class="b sm" onclick="jointMismatchApply()">일괄 정리 (삭제 ${pl.del.length}건 · 수정 ${pl.fix.length}건)</button>`,items:[...pl.del.map(x=>({id:x.r.id,t:nm(x.r)+` — 시험 항목은 ${x.want}, 같은 조건의 ${x.want} 기록이 이미 있음 → 삭제 대상`})),...pl.fix.map(x=>({id:x.r.id,t:nm(x.r)+` — 시험 항목은 ${x.want} → ${x.want}로 수정 대상`}))]}); }

 <ul style="margin:6px 0 0 18px;padding:0"><li><b>구조 (ISO)</b>: 화살표는 기준선 <u>왼쪽 끝</u>, 꼬리는 <u>오른쪽 끝</u>. 기준선은 <b>실선</b>이고 그 <u>바로 아래에 점선</u>이 있습니다.</li>

const GF_GROOVE=['vgroove','xgroove','bevel','kgroove','ugroove','jgroove','tbevel'];
function genRel(k,G){ const ty=G.type, bb=G.backing==='none'&&G.backBead, BK=BUTT_BACK.includes(ty)||ty==='tbevel';
  switch(k){
    case 't2': return ['tee','tbevel','lap'].includes(ty);
    case 'angle': case 'face': return GF_GROOVE.includes(ty);
    case 'gap': return GF_GROOVE.includes(ty)||ty==='square';
    case 'r': return ['ugroove','jgroove'].includes(ty);
    case 'leg': return ['tee','lap','tbevel'].includes(ty);
    case 'backing': return ['square','vgroove','bevel','ugroove','jgroove','custom','tbevel'].includes(ty);
    case 'backBead': return G.backing==='none'&&BK;
    case 'backH': case 'backW': return bb&&BUTT_BACK.includes(ty);
    case 'backLeg': return bb&&ty==='tbevel';
    case 'backOrder': return bb&&BK;
    case 'custom': case 'mirror': case 'symKind': return ty==='custom';
    case 'layers': case 'beadStyle': case 'clipBeads': return ty!=='square';
    case 'symSide': return !!G.symbol&&!['xgroove','kgroove','tee'].includes(ty)&&!(bb&&BK);
    case 'symDim': return !!G.symbol&&['tee','lap'].includes(ty);
    case 'symS': return !!G.symbol&&!['tee','lap'].includes(ty);
    case 'symSystem': case 'contour': case 'allAround': case 'field': case 'symN': case 'symL': case 'symE':
    case 'tailProc': case 'tailLvl': case 'tailLvlPrefix': case 'tailPos': case 'tailFiller': case 'tailRef': return !!G.symbol;
  } return true; }

    else if(el.type==='checkbox'){ if(lab&&!lab.querySelector('.gna')) lab.insertAdjacentHTML('beforeend','<small class="gna" style="color:var(--mute)"> (해당 없음)</small>'); }

async function recommendWps(){
  if(!wpsMaster.length) return autoAssignWps();   // 마스터가 없으면 예전 방식(과거 기록의 조건 복사)
  const todo=records.map(r=>({r,sg:(r.wpsNo||'').trim()?null:suggestWps(r)})).filter(x=>x.sg);
  const none=records.filter(r=>!(r.wpsNo||'').trim()).length-todo.length;
  if(!todo.length) return alert(`추천할 수 있는 미지정 기록이 없습니다.${none?`\n(용접사 시험용 WPS 범위에 맞는 WPS가 없는 미지정 기록 ${none}건)`:''}`);
  const per=new Map(); todo.forEach(x=>per.set(x.sg.wpsNo,(per.get(x.sg.wpsNo)||0)+1));
  if(!confirm(`WPS가 비어 있는 기록 ${todo.length}건에 WPS 마스터의 '용접사 시험용(Welder Test)' WPS 중 시험 조건(형식·공정·자세·두께)에 맞는 것을 지정합니다.\n\n${[...per].sort((a,b)=>b[1]-a[1]).map(([w,n])=>`${w}: ${n}건`).join('\n')}\n\n맞는 WPS가 없어 미지정으로 남는 기록: ${none}건\n\n계속할까요?`)) return;
  await DB.putMany('records',todo.map(x=>({...x.r,wpsNo:x.sg.wpsNo}))); await load(); drawWps(); toast(`${todo.length}건에 WPS를 지정했습니다.`,5000); }
const wkey=r=>[r.process,r.joint,r.thickness,String(r.position).toUpperCase()].join('|');
async function autoAssignWps(){
  const m=new Map(); for(const r of records){ const k=(r.wpsNo||'').trim(); if(!k) continue; const key=wkey(r); if(!m.has(key)) m.set(key,new Set()); m.get(key).add(k); }
  const uniqMap=new Map([...m].filter(([,v])=>v.size===1).map(([k,v])=>[k,[...v][0]])), amb=[...m].filter(([,v])=>v.size>1).length;

// ===================== 6개월 서명 (ISO 9606-1 9.2): 근무일 계산 · 일괄 기입 =====================
// 음력 공휴일(설·부처님오신날·추석)과 그 대체공휴일, 선거일·임시공휴일. 양력 고정 공휴일과 그 대체공휴일은 아래에서 계산한다.
// ※ 정부 발표(임시공휴일 등)로 바뀔 수 있으니 설정의 '추가 공휴일 / 공휴일에서 제외'로 보정한다.
const KR_HOL_VAR={2022:'01-31 02-01 02-02 03-09 05-08 06-01 09-09 09-10 09-11 09-12 10-10',2023:'01-21 01-22 01-23 01-24 05-27 05-29 09-28 09-29 09-30 10-02',
  2024:'02-09 02-10 02-11 02-12 04-10 05-06 05-15 09-16 09-17 09-18 10-01',2025:'01-27 01-28 01-29 01-30 03-03 05-06 06-03 10-05 10-06 10-07 10-08',
  2026:'02-16 02-17 02-18 05-24 05-25 06-03 09-24 09-25 09-26',2027:'02-06 02-07 02-08 02-09 05-13 09-14 09-15 09-16',2028:'01-26 01-27 01-28 04-12 05-02 10-02 10-03 10-04 10-05',
  2029:'02-12 02-13 02-14 05-20 05-21 09-21 09-22 09-23 09-24',2030:'02-02 02-03 02-04 02-05 05-09 06-03 09-11 09-12 09-13'};
let KRH={};
function krHolidays(y){ if(KRH[y]) return KRH[y]; const H=new Set(), add=d=>H.add(d);
  ['01-01','03-01','05-05','06-06','08-15','10-03','10-09','12-25'].forEach(md=>add(`${y}-${md}`)); String(KR_HOL_VAR[y]||'').split(/\s+/).filter(Boolean).forEach(md=>add(`${y}-${md}`));
  // 대체공휴일: 3·1절·광복절·개천절·한글날(2021~), 어린이날, 성탄절(2023~)이 토·일이면 다음 평일
  ['03-01','05-05','08-15','10-03','10-09',...(y>=2023?['12-25']:[])].forEach(md=>{ const d=`${y}-${md}`, w=pd(d).getUTCDay(); if(w===0||w===6){ let n=addDays(d,1); while([0,6].includes(pd(n).getUTCDay())||H.has(n)) n=addDays(n,1); add(n); } });
  String(S.holExtra||'').match(/\d{4}-\d{2}-\d{2}/g)?.forEach(d=>{ if(d.startsWith(y+'-')) add(d); }); String(S.holOff||'').match(/\d{4}-\d{2}-\d{2}/g)?.forEach(d=>H.delete(d));
  return KRH[y]=H; }
function isWorkday(d){ const w=pd(d).getUTCDay(); return w!==0&&w!==6&&!krHolidays(+d.slice(0,4)).has(d); }
function shiftWorkday(d,dir){ let x=d, n=0; while(!isWorkday(x)&&n++<20) x=addDays(x,dir); return x; }
function addMonths(d,m){ const x=pd(d), day=x.getUTCDate(); let e=new Date(Date.UTC(x.getUTCFullYear(),x.getUTCMonth()+m,day)); if(e.getUTCDate()!==day) e=new Date(Date.UTC(x.getUTCFullYear(),x.getUTCMonth()+m+1,0)); return iso(e); }
// 아직 기입하지 않은 6개월 서명 중 오늘까지 기한이 지난 것: 용접일 + 6·12·18·24·30개월, 주말·공휴일이면 직전(설정: 다음) 근무일
function renewPlan(r,t){ t=t||today(); const exp=calcExpire(r.weldingDate), out=[]; for(let k=(r.renewals||[]).length+1;k<=5;k++){ const due=addMonths(r.weldingDate,6*k); if(due>t||due>exp) break; let d=shiftWorkday(due,S.renewShift==='next'?1:-1); if(d>t) d=shiftWorkday(due,-1); out.push(d); } return out; }
async function bulkRenew(onlyIds){ const t=today(), wm=new Map(welders.map(w=>[w.id,w])), list=records.filter(r=>{ const w=wm.get(r.welderId); return w&&w.status!=='퇴사'&&w.status!=='미입사'&&(!onlyIds||onlyIds.has(r.welderId))&&recStatus(r)==='pass'&&calcExpire(r.weldingDate)>=t; }).map(r=>({r,add:renewPlan(r,t)})).filter(x=>x.add.length);
  if(!list.length) return alert('밀린 6개월 서명이 없습니다. (재직자의 유효한 합격 인증서 기준)');
  const n=list.reduce((a,x)=>a+x.add.length,0), ex=list.slice(0,8).map(({r,add})=>`${(wm.get(r.welderId)||{}).name} ${r.joint} t${fmtN(r.thickness)} ${r.position} (용접 ${r.weldingDate}): ${add.join(', ')}`).join('\n');
  if(!confirm(`밀린 6개월 서명을 인증서 ${list.length}건에 ${n}회 기입합니다.\n날짜 = 용접일 + 6개월 단위, 주말·공휴일이면 ${S.renewShift==='next'?'다음':'직전'} 근무일\n${S.renewSign?(S.signature?'인증서 서명란에 등록된 서명 이미지가 들어갑니다.':'※ 등록된 서명 이미지가 없어 날짜·직책만 표시됩니다 (설정에서 서명 등록).'):'(설정에서 서명 이미지 넣기가 꺼져 있습니다)'}\n\n${ex}${list.length>8?`\n… 외 ${list.length-8}건`:''}\n\n계속할까요?`)) return;
  await DB.putMany('records',list.map(({r,add})=>({...r,renewals:[...(r.renewals||[]),...add]}))); await load(); render(); toast(`인증서 ${list.length}건에 6개월 서명 ${n}회를 기입했습니다.`,4000); }
async function addRenewal(id){const r=records.find(x=>x.id===id);r.renewals=r.renewals||[];
  if(r.renewals.length>=5) return alert('서명 갱신은 최대 5회입니다.');
  const plan=renewPlan(r);
  if(plan.length>1&&confirm(`밀린 6개월 서명이 ${plan.length}회 있습니다 (용접일 ${r.weldingDate} 기준, 주말·공휴일 제외):\n${plan.join(', ')}\n\n한 번에 모두 기입할까요?\n(취소 = 날짜를 직접 입력해 1회만)`)){ r.renewals.push(...plan); }
  else { const def=plan[0]||shiftWorkday(today(),-1), d=prompt(`서명 갱신일 (YYYY-MM-DD)\n추천: ${def}${plan[0]?` (용접일+${6*(r.renewals.length+1)}개월, 근무일)`:''}`,def); if(!d) return; if(!dateOk(d)) return alert('날짜를 YYYY-MM-DD 형식으로 입력하세요.');
    if(!isWorkday(d)&&!confirm(`${d}은(는) 주말 또는 공휴일입니다. 그대로 기입할까요?`)) return; r.renewals.push(d); r.renewals.sort(); }
  await DB.put('records',r); await load(); render(); toast('6개월 서명을 기입했습니다.',2500); }

// ===================== 인증서 =====================
// Reference No. = {접두어}-{용접사 순번}-{공정}-T{두께}-{유형}-{자세}
//   예) EN ISO 9606-1-RM-1-135-T12-BW-PC  (RM=Romansys, 1=용접사 번호 RM-WD-24001 의 끝 3자리 001)
//   순번: 번호 끝 3자리(기본) 또는 끝 숫자 전체(설정). 저장하지 않고 항상 계산하므로 번호 체계를 바꿔도 자동 반영된다.
function refSeq(w){ const m=String((w&&w.welderNo)||'').match(/(\d+)\s*$/); if(!m) return ''; const d=m[1];
  return parseInt(S.refSeqMode==='all'||d.length<=3?d:d.slice(-3),10); }
function refBase(c){ const w=welders.find(x=>x.id===c.welderId); return `${S.refPrefix}-${refSeq(w)}-${processCode(c.process)}-T${fmtN(c.thickness)}-${c.joint}-${String(c.position).toUpperCase()}`; }
function autoRef(c){ const base=refBase(c); // 같은 용접사·같은 조건에서 합격이 반복 발행(재시험/갱신)되면 -2, -3 …
  const earlier=records.filter(x=>x.id!==c.id&&x.welderId===c.welderId&&refBase(x)===base&&recStatus(x)==='pass'&&(x.weldingDate<c.weldingDate||(x.weldingDate===c.weldingDate&&x.id<(c.id||1e12)))).length;
  return earlier?`${base}-${earlier+1}`:base; }
const isAutoRef=t=>new RegExp('^'+String(S.refPrefix).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'-\\d+-\\d+-T[\\d.]+-(BW|FW)-[A-Z0-9-]+$','i').test(String(t||''));
function checkDupRefs(){ // 서로 다른 용접사가 같은 Reference No. 를 갖는지 (용접사 번호 체계 검토용)
  const m=new Map(); for(const r of records){ if(recStatus(r)!=='pass') continue; const k=r.refNo||autoRef(r); if(!m.has(k)) m.set(k,new Set()); m.get(k).add(r.welderId); }
  const dup=[...m].filter(([,v])=>v.size>1);
  alert(dup.length?`서로 다른 용접사가 같은 Reference No.를 쓰는 경우 ${dup.length}건:\n\n${dup.slice(0,12).map(([k,v])=>`${k}  (${[...v].map(id=>(welders.find(w=>w.id===id)||{}).welderNo).join(', ')})`).join('\n')}${dup.length>12?'\n…':''}\n\n용접사 번호 끝 3자리가 겹치는 경우입니다(예: 24001, 27001 → 둘 다 1). 번호 체계를 바꾸거나 설정에서 "끝 숫자 전체"를 쓰세요.`:'중복된 Reference No.가 없습니다.'); }
// 레이저 용접 공정 코드는 52(ISO 4063): 예전에 521 로 저장된 값을 정리
// 사내 판정 기준: 엑셀 시험 기록서의 '합격' 열은 BW=굽힘(●), FW=단면(●)이 있어야 합격 → 앱도 사내 엄격 기준(BW: RT/UT+Bend, FW: Macro)을 기본으로 한다 (한 번만 적용)
async function autoFixStrict(){ if(S.strictInit===2) return; S.strictInit=2; if(!S.strict){ S.strict=true; toast('판정 기준을 사내 기준(BW: VT+RT/UT+Bend, FW: VT+Macro)으로 바꿨습니다. 설정에서 바꿀 수 있습니다.',8000); } await saveSettings(); }
async function autoFixApproval(){ // 예전 버전은 목록의 '승인'(= 시험 입열량) 칸을 approval(목 두께)로 잘못 읽었음 -> heat 로 이동
  const q=pqrMaster.filter(m=>m.approval!=null&&String(m.approval).trim()&&/^[\d.\s~\-]+$/.test(String(m.approval)));
  if(q.length){ await DB.putMany('pqr',q.map(m=>{ const nums=(String(m.approval).match(/\d+(?:\.\d+)?/g)||[]).map(Number), {approval,...r}=m; if(!r.heat&&nums.length) r.heat=String(Math.max(...nums)); return r; })); await load(); } }
async function autoFixProc(){ const fx=x=>String(x||'').replace(/^521\b/,'52'); let n=0;
  const rec=records.filter(r=>/^521\b/.test(r.process||'')); if(rec.length){ await DB.putMany('records',rec.map(r=>({...r,process:fx(r.process)}))); n+=rec.length; }
  const w=wpsMaster.filter(m=>/^521\b/.test(m.process||'')||(m.procCodes||[]).includes('521')); if(w.length){ await DB.putMany('wps',w.map(m=>({...m,process:fx(m.process),procCodes:(m.procCodes||[]).map(fx)}))); n+=w.length; }
  const q=pqrMaster.filter(m=>/^521\b/.test(m.process||'')); if(q.length){ await DB.putMany('pqr',q.map(m=>({...m,process:fx(m.process)}))); n+=q.length; }
  if(n){ await load(); toast(`레이저 용접 공정 코드 521 → 52 로 ${n}건 정리했습니다.`,6000); } }
async function autoFixRef(){ // 예전에 저장된 자동 생성 번호(용접사별 기록 순번 방식)를 정리 -> 이후 규칙으로 항상 계산
  const t=records.filter(r=>r.refNo&&isAutoRef(r.refNo)); if(!t.length) return;
  const changed=t.filter(r=>autoRef({...r,refNo:''})!==r.refNo).length;
  await DB.putMany('records',t.map(r=>({...r,refNo:''}))); await load();
  toast(`Reference No. ${t.length}건을 규칙(용접사 번호 끝 3자리)으로 정리했습니다${changed?` — 그중 ${changed}건은 번호가 바뀌었습니다`:''}.`,8000); }

  o.innerHTML=Z.length?Z.map((z,i)=>`<div class="dz2" data-i="${i}"><span class="ic">${z.ic}</span><b>${esc(z.t)}</b><small>${esc(z.s||'')}</small></div>`).join('')+`<div class="nt">${Z.length>1?'원하는 칸 위에 놓으세요':'아무 곳에나 놓으면 가져옵니다'}</div>`:`<div class="dz2"><span class="ic">🚫</span><b>이 화면에서는 가져올 파일이 없습니다</b><small>용접사 · 시험기록 · WPS · 설정 탭에서 끌어놓으세요</small></div>`;
  document.body.appendChild(o); }
document.addEventListener('dragenter',e=>{ if(!dragHasFiles(e)||(e.target.closest&&e.target.closest('.pz'))) return; DRG++; dropOv(true); });
document.addEventListener('dragleave',e=>{ if(!document.getElementById('dropov')) return; DRG--; if(DRG<=0) dropOv(false); });
document.addEventListener('dragover',e=>{ const o=document.getElementById('dropov'); if(!o) return; e.preventDefault(); e.dataTransfer.dropEffect='copy'; o.querySelectorAll('.dz2').forEach(z=>z.classList.toggle('over',z.contains(e.target)||(o.querySelectorAll('.dz2[data-i]').length===1&&!!z.dataset.i))); });
document.addEventListener('drop',async e=>{ const o=document.getElementById('dropov'); if(!o) return; e.preventDefault(); const Z=dropZones(), zEl=e.target.closest&&e.target.closest('.dz2[data-i]'); dropOv(false);
  const z=zEl?Z[+zEl.dataset.i]:(Z.length===1?Z[0]:null); if(!Z.length) return; if(!z) return toast('여러 가져오기가 있는 화면입니다. 원하는 칸 위에 놓아 주세요.',3500);
  const files=[...e.dataTransfer.files], ok=files.filter(f=>z.acc.test(f.name)), bad=files.length-ok.length;
  if(!ok.length) return toast(`이 칸에서 받을 수 있는 파일이 아닙니다 (${files.map(f=>f.name).slice(0,3).join(', ')}).`,4500);
  if(bad) toast(`형식이 맞지 않는 ${bad}개 파일은 건너뜁니다.`,3000);
  try{ await z.f(ok); }catch(err){ alert('가져오기 실패: '+(err.message||err)); } });

// ---- 서버 모드 보조: 상태 표시 / 다른 PC 변경 감지 / 조회 전용 UI 잠금 / 계정 관리
function remoteBadge(){ if(!REMOTE.on) return; document.getElementById('srvb')?.remove(); const h=document.querySelector('header h1'); if(!h) return; h.insertAdjacentHTML('beforeend',`<span id="srvb" title="서버에 연결되어 있습니다">🖥 ${esc(REMOTE.user)} · ${REMOTE.role==='master'?'마스터':'조회 전용'}<a href="#" onclick="remoteLogout();return false">로그아웃</a></span>`); }
async function remoteLogout(){ try{ await rapi('/api/logout',{}); }catch(e){} location.reload(); }
async function remotePoll(){ if(!REMOTE.on||document.visibilityState!=='visible') return; try{ const r=await fetch('/api/version',{credentials:'same-origin'}); if(r.status===401){ await remoteLogin(); return; } const j=await r.json(); if(j.v!==REMOTE.v){ REMOTE.v=j.v; syncPing(); } }catch(e){} }
const RO_OK=/내보내|다운로드|인쇄|PDF|pdf|미리보기|엑셀|SVG|PNG|닫기|취소|보기|검색|필터|로그아웃|새로고침|크게|펼|접기|선택 해제|전체 선택/, RO_BAD=/저장|삭제|추가|수정|편집|가져오|일괄|복원|초기화|발급|확정|적용|되돌리|병합|정리|변경|등록|지정|채우기|복제|이름|붙여|스케치|생성|계산|재계산|종결|갱신|연결|업로드|사진/;
function roGuard(){ if(!RO()) return; document.querySelectorAll('button,label.b').forEach(b=>{ const t=(b.textContent||'').trim(); if(!t||b.dataset.ro) return; if(RO_BAD.test(t)&&!RO_OK.test(t)){ b.dataset.ro='1'; b.disabled=true; b.style.opacity='.4'; b.title='조회 전용 계정입니다'; if(b.matches('label')) b.style.pointerEvents='none'; } }); }
if(typeof MutationObserver!=='undefined'){ let _rg; new MutationObserver(()=>{ if(!RO()) return; clearTimeout(_rg); _rg=setTimeout(roGuard,120); }).observe(document.body,{childList:true,subtree:true}); }
async function acctRender(){ const box=document.getElementById('acct'); if(!box) return; let L=[]; try{ L=await rapi('/api/users'); }catch(e){ box.innerHTML=`<div class="msg err">${esc(e.message)}</div>`; return; }
  box.innerHTML=`<table class="list nested"><thead><tr><th>아이디</th><th>권한</th><th>생성일</th><th></th></tr></thead><tbody>${L.map(u=>`<tr class="kid"><td>${esc(u.name)}${u.name===REMOTE.user?' <small>(나)</small>':''}</td><td>${u.role==='master'?'마스터':'조회 전용'}</td><td>${(u.created||'').slice(0,10)}</td><td class="bx"><button class="b sm sec" onclick="acctPass('${esc(u.name)}')">비밀번호 변경</button> ${u.name===REMOTE.user?'':`<button class="b sm red" onclick="acctDel('${esc(u.name)}')">삭제</button>`}</td></tr>`).join('')}</tbody></table>`; }
async function acctAdd(){ const name=prompt('새 계정 아이디 (2~30자)'); if(!name) return; const role=confirm('이 계정을 "마스터"(모든 수정 가능)로 만들까요?\n\n확인 = 마스터\n취소 = 조회 전용(조회·내려받기만)')?'master':'viewer'; const pass=prompt('비밀번호 (6자 이상)'); if(!pass) return; try{ await rapi('/api/users',{name,pass,role}); toast('계정을 만들었습니다.',2500); acctRender(); }catch(e){ alert(e.message); } }
async function acctPass(name){ const pass=prompt(`"${name}" 의 새 비밀번호 (6자 이상)`); if(!pass) return; try{ await rapi('/api/users',{name,pass}); toast('비밀번호를 바꿨습니다. (해당 계정은 다시 로그인해야 합니다)',3500); acctRender(); }catch(e){ alert(e.message); } }
async function acctDel(name){ if(!confirm(`계정 "${name}" 을(를) 삭제할까요?`)) return; try{ await rapi('/api/users/del',{name}); acctRender(); }catch(e){ alert(e.message); } }
async function acctMine(){ const old=prompt('현재 비밀번호'); if(old===null) return; const pass=prompt('새 비밀번호 (6자 이상)'); if(!pass) return; try{ await rapi('/api/passwd',{old,pass}); toast('비밀번호를 바꿨습니다.',2500); }catch(e){ alert(e.message); } }
DB.open().then(load).then(async()=>{ if(RO()) return; for(const f of [autoFixNo,autoFixRef,autoFixApproval,autoFixProc,autoFixStrict,autoFixVT]) await f(); }).then(render).catch(e=>{document.body.insertAdjacentHTML('beforeend','<div class="msg err">저장소를 열 수 없습니다: '+esc(e)+'</div>');});
</script>
