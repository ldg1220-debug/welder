<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>용접사 자격 인증서 관리</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#1c2530;--mute:#6b7785;--line:#d5dbe1;--accent:#1f5fae;--ok:#1a7f4b;--bad:#c62828;--warn:#b7791f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif}
header{background:#14314f;color:#fff;padding:10px 20px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
header h1{font-size:16px;margin:0 12px 0 0}
nav button{background:none;border:0;color:#cfe0f3;padding:8px 12px;cursor:pointer;font:inherit;border-radius:6px}
nav button.on{background:#fff;color:#14314f;font-weight:600}
main{max-width:1560px;margin:0 auto;padding:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:16px}
h2{font-size:16px;margin:0 0 12px}h3{font-size:14px;margin:14px 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
label{display:flex;flex-direction:column;font-size:12px;color:var(--mute);gap:3px}
input,select,textarea{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:5px;color:var(--ink);background:#fff}
button.b{background:var(--accent);color:#fff;border:0;padding:7px 14px;border-radius:5px;cursor:pointer;font:inherit}
button.b.sec{background:#e8edf2;color:var(--ink)}button.b.red{background:var(--bad)}button.b.sm{padding:3px 8px;font-size:12px}
table.list{width:100%;border-collapse:collapse}
table.list th,table.list td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;white-space:nowrap}
.tw{overflow-x:auto;max-height:70vh;overflow-y:auto;border:1px solid var(--line);border-radius:6px}
.tw table.list th{position:sticky;top:0;z-index:1}
table.list tbody tr:hover{background:#f5f8fb}
.m{display:inline-block;width:20px;text-align:center;font-weight:700}.m.p{color:var(--ok)}.m.f{color:var(--bad)}.m.n{color:#b5bcc5}
td.num,th.num{text-align:center!important}
.bx{white-space:nowrap}
table.list td{overflow:hidden;text-overflow:ellipsis;max-width:0}
table.list td.bx{max-width:none}
table.list.measure td{max-width:none;overflow:visible}
table.list th{position:relative}
.rh{position:absolute;right:0;top:0;bottom:0;width:7px;cursor:col-resize;user-select:none}.rh:hover,.rh:active{background:var(--accent);opacity:.5}
.pz{border:2px dashed var(--line);border-radius:6px;min-height:64px;padding:6px;display:flex;align-items:center;gap:8px;color:var(--mute);font-size:12px;cursor:pointer;background:#fafbfc}
.pz:focus,.pz.over{border-color:var(--accent);outline:0;background:#eef5fd;color:var(--accent)}
.lib{display:flex;gap:10px;flex-wrap:wrap}.li{position:relative;border:2px solid var(--line);border-radius:6px;padding:3px;background:repeating-conic-gradient(#eef0f2 0 25%,#fff 0 50%) 50%/12px 12px}
.li.on{border-color:var(--accent);box-shadow:0 0 0 2px #cfe0f3}.li img{height:52px;max-width:120px;cursor:pointer;display:block}
.li b{position:absolute;top:-9px;right:-9px;background:var(--bad);color:#fff;border-radius:50%;width:18px;height:18px;text-align:center;line-height:18px;font-size:12px;cursor:pointer}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#14314f;color:#fff;padding:10px 16px;border-radius:8px;max-width:80vw;z-index:50;display:none;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.pz img{max-height:52px;max-width:90px;border:1px solid var(--line);border-radius:3px;background:#fff}
table.list th{background:#eef2f6;font-size:12px}
.pill{white-space:nowrap;display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;color:#fff}
.pass{background:var(--ok)}.fail{background:var(--bad)}.pending{background:var(--warn)}
.stats{display:flex;gap:12px;flex-wrap:wrap}.stat{flex:1;min-width:150px;text-align:center}.stat b{display:block;font-size:26px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.range td{padding:4px 8px;border-bottom:1px solid var(--line)}
.chk{color:var(--warn);font-size:12px}
.msg{padding:8px 12px;border-radius:6px;margin:8px 0}.msg.err{background:#fdecea;color:var(--bad)}.msg.info{background:#eaf2fb}
.thumb{height:64px;border:1px solid var(--line);border-radius:4px}
.hide{display:none}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);overflow:auto;padding:20px;z-index:10}
#modal .sheet{margin:0 auto;background:#fff;width:210mm;padding:0}
#modal .bar{position:sticky;top:0;text-align:right;padding:6px;background:#14314f}
/* ---- 인증서 (화면 미리보기 & 인쇄 공용) ---- */
.cert{width:210mm;min-height:297mm;padding:9mm 10mm;background:#fff;color:#000;font:8.6pt/1.3 "Malgun Gothic",Arial,sans-serif}
.cert table{width:100%;border-collapse:collapse}
.cert td,.cert th{border:1px solid #000;padding:2px 5px;vertical-align:middle}
.cert .noborder td{border:0;padding:1px 3px}
.cert .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4mm}
.cert .top .co{width:52mm;font-weight:700;font-size:13pt}
.cert .top .ti{text-align:center;flex:1}.cert .top .ti b{font-size:14pt;display:block}
.cert .top .tm{width:42mm;border:1px solid #000;text-align:center;padding:3px}
.cert .lab{color:#000}.cert .val{color:#0033cc}
.cert .c{text-align:center}.cert .sm{font-size:7pt}
.cert .sigbox{position:relative;height:17mm}.cert .sigbox .stamp{position:absolute;left:36mm;top:0;height:16mm;opacity:.9}.cert .sigbox .sign{position:absolute;left:47mm;top:0;height:16mm;max-width:30mm}
.cert img.photo{width:30mm;height:38mm;object-fit:cover}.cert img.sign{max-height:14mm;max-width:40mm}
@media print{
  @page{size:A4;margin:0}
  body{background:#fff}
  header,main,#modal .bar{display:none!important}
  #modal{position:static;background:none;padding:0;overflow:visible}
  #modal .sheet{width:auto}
}
body.printing header,body.printing main{display:none}
</style>
</head>
<body>
<header>
  <h1>🔧 용접사 자격 인증서 관리 <span style="font-weight:400;font-size:12px;opacity:.7">ISO 9606-1</span> <span id="ver" title="이 화면이 최신이 아니면 파일을 다시 받아 교체하세요" style="font-weight:400;font-size:11px;background:#2a5a8a;border-radius:8px;padding:1px 8px;margin-left:6px">v8 · VT 자동 통과</span></h1>
  <nav id="nav"></nav>
</header>
<main id="view"></main>
<div id="modal" class="hide"><div class="sheet"><div class="bar">
  <button class="b" onclick="window.print()">🖨 인쇄 / PDF로 저장</button>
  <button class="b sec" onclick="closeModal()">닫기</button></div><div id="modalBody"></div></div></div>

<script>
/*ENGINE-START*/
// ===================== ISO 9606-1 규격 엔진 (DOM 미사용, 순수 함수) =====================
// confidence: 'high' = 샘플 인증서/규격 조항으로 확신, 'check' = 규격서 원문(표) 대조 필요
const STD = 'ISO 9606-1';
const INF = Infinity;
function fmtN(n){ return String(Number(Number(n).toFixed(2))); }
function pd(s){ const [y,m,d]=String(s).slice(0,10).split('-').map(Number); return new Date(Date.UTC(y,m-1,d)); }
function iso(dt){ return dt.toISOString().slice(0,10); }

// 9.3 a) : 유효기간 = 용접일 + 3년 - 1일
function calcExpire(weldingDate){
  const d=pd(weldingDate), y=d.getUTCFullYear()+3, m=d.getUTCMonth(), day=d.getUTCDate();
  let e=new Date(Date.UTC(y,m,day));
  if(e.getUTCMonth()!==m) e=new Date(Date.UTC(y,m+1,0)); // 2/29 -> 2/28
  return iso(new Date(e.getTime()-86400000));
}
function validityText(w,e){ return `${w} ~ ${e} (refer to 9.3 a)`; }
function monthsBetween(a,b){ // 꽉 찬 개월 수
  const s=pd(a), e=pd(b); let m=(e.getUTCFullYear()-s.getUTCFullYear())*12+e.getUTCMonth()-s.getUTCMonth();
  const last=new Date(Date.UTC(e.getUTCFullYear(),e.getUTCMonth()+1,0)).getUTCDate();
  if(e.getUTCDate()<Math.min(s.getUTCDate(),last)) m--; return Math.max(m,0);
}
// 상태: expired(적색) / renewal(황색: 경과개월 > 갱신횟수*6+6) / null
function certAlert(weldingDate, expireDate, renewalCount, today){
  if(today>expireDate) return 'expired';
  if(monthsBetween(weldingDate,today) > renewalCount*6+6) return 'renewal';
  return null;
}

// 합/불 판정. 기본은 ISO 9606-1 Table 1 (BW: VT + [RT/UT 또는 굽힘/파단], FW: VT + [Macro 또는 파단]).
// companyStrict=true 이면 사내 기준(BW: VT+RT/UT+Bend, FW: VT+Macro 모두).
function judge(joint, t, companyStrict){
  const v=k=>t[k]||'na';
  const all=['vt','rtut','bend','macro','fracture','additional'].map(v);
  if(all.includes('fail')) return 'fail';
  if(joint==='BW'){
    if(v('vt')!=='pass') return 'pending';
    if(companyStrict) return (v('rtut')==='pass'&&v('bend')==='pass')?'pass':'pending';
    return (v('rtut')==='pass'||v('bend')==='pass'||v('fracture')==='pass')?'pass':'pending';
  }
  if(v('vt')!=='pass') return 'pending';
  if(companyStrict) return v('macro')==='pass'?'pass':'pending';
  return (v('macro')==='pass'||v('fracture')==='pass')?'pass':'pending';
}

// VT는 RT/UT·굽힘·단면 시험보다 먼저 수행하므로, 다음 단계 결과(Pass/Fail)가 있으면 VT는 통과한 것으로 본다.
// VT에 Fail이 명시된 경우는 그대로 둔다.
function applyImpliedVT(t){ const v=k=>t[k]||'na'; if(v('vt')!=='na') return t;
  return ['rtut','bend','macro','fracture','additional'].some(k=>v(k)==='pass'||v(k)==='fail')?{...t,vt:'pass'}:t; }

const POS_BW={PA:['PA'],PC:['PA','PC'],PE:['PA','PC','PD','PE'],PF:['PA','PF'],PG:['PG']};
const POS_FW={PA:['PA'],PB:['PA','PB'],PC:['PA','PB','PC'],PD:['PA','PB','PD'],PF:['PA','PB','PF'],PG:['PG']};
const POS_HIGH={BW:['PA','PC','PF'],FW:[]}; // 샘플/확신 있는 항목
const FILLER_GRP={FM1:['FM1','FM2'],FM2:['FM2']};
const FILLER_TYPE={S:['S','M'],M:['M'],B:['B']};
const BACKING={'ss nb':['ss nb','ss mb','bs'],'ss mb':['ss mb'],'bs':['bs'],'N/A':['N/A']};

function thicknessRange(joint,t){
  if(!(t>0)) return null;
  if(joint==='BW'){
    if(t<3)  return {lo:t,hi:2*t};
    if(t<12) return {lo:3,hi:2*t};
    return {lo:3,hi:INF};
  }
  return t<3?{lo:t,hi:2*t}:{lo:3,hi:INF}; // FW
}
function rangeText(r,sym){ if(!r) return '-'; return r.hi===INF?`≥ ${fmtN(r.lo)}`:`${fmtN(r.lo)} ≤ ${sym} ≤ ${fmtN(r.hi)}`; }
function processCode(p){ return String(p||'').trim().split(/\s+/)[0]; }

// input: {process,productType:'P'|'T',pipeDiameter,joint:'BW'|'FW',transfer,fillerGroup,fillerType,fillerDesignation,
//        gas,backing,thickness,deposited,position,weldingDate}
function calculateRangeOfApproval(input, standard){
  standard = standard||STD;
  if(standard!==STD) return {manual_review_required:true, warnings:[`규격 ${standard} 미지원`], items:[]};
  const i=input, W=[], items=[]; let manual=false;
  const add=(key,label,test,range,source,confidence)=>{ items.push({key,label,test,range,source,confidence:confidence||'high'}); };
  const j=i.joint, code=processCode(i.process), t=Number(i.thickness), s=Number(i.deposited||i.thickness);

  add('process','용접방법 Welding process',i.process,i.process,'ISO 9606-1 5.2 / Table 5');
  if(!['135','136','138','141','121','111','114','131','311'].includes(code)) W.push(`공정 ${code}: 규격서 확인 필요`);
  if(code==='311'){ manual=true; W.push('311(가스용접)은 두께 범위 규칙이 달라 자동 산출 불가 → 수동 검토'); }

  // 제품 형태
  if(i.productType==='T'){
    const D=Number(i.pipeDiameter);
    let rng; if(!(D>0)) {rng='-'; W.push('관 외경(D) 미입력');} else rng = D<=25?`${fmtN(D)} ≤ D ≤ ${fmtN(2*D)}`:`D ≥ ${fmtN(Math.max(0.5*D,25))}`;
    add('product','판재 또는 파이프 Plate or pipe','T','T, P','ISO 9606-1 Table 6','check');
    add('diameter','파이프 직경 Pipe diameter',D>0?fmtN(D):'-',rng,'ISO 9606-1 Table 6','check');
  }else{
    add('product','판재 또는 파이프 Plate or pipe','P','P, T (F:D≥500mm / R:D≥75mm)','ISO 9606-1 Table 6 (샘플 인증서)');
    add('diameter','파이프 직경 Pipe diameter','N/A','N/A','ISO 9606-1 Table 6');
  }
  add('joint','용접 유형 Type of Weld',j,j,'ISO 9606-1 Table 7 / 5.4','check');
  if(j==='FW') W.push('필릿 시험은 맞대기 자격과 별개 (규격서 확인)');

  // 이행 모드(GMAW 계열만)
  if(/^13/.test(code)){
    const tr=i.transfer||'globular/spray';
    const rng=tr==='short'?'Short circuit':tr==='pulsed'?'Pulsed':'Globular or Spray';
    add('transfer','용접 이행 Transfer mode',tr,rng,'ISO 9606-1 5.3(샘플 인증서)', tr==='globular/spray'?'high':'check');
  }else add('transfer','용접 이행 Transfer mode','-','-','—');

  add('material','모재 그룹 Material Group',i.materialGroup||'-','-','ISO 9606-1 (샘플 인증서)','check');
  // 용가재
  const fg=String(i.fillerGroup||'').replace(/\s/g,'');
  if(FILLER_GRP[fg]) add('fillerGroup','용가재 그룹 Filler material group',fg,FILLER_GRP[fg].join(', '),'ISO 9606-1 Table 3', fg==='FM1'?'high':'check');
  else if(fg){ manual=true; W.push(`용가재 그룹 ${fg}: Table 3 수동 확인 필요`); add('fillerGroup','용가재 그룹 Filler material group',fg,'수동 확인','ISO 9606-1 Table 3','check'); }
  const ft=i.fillerType||'S';
  add('fillerType','용가재 종류 Filler material designation',ft,(FILLER_TYPE[ft]||[ft]).join(', '),'ISO 9606-1 Table 4', ft==='S'?'high':'check');
  add('gas','보호가스 Shielding gas',i.gas||'-',i.gas?'Similar shielding gas':'-','ISO 9606-1 Table 5');

  // 백킹/이면 처리
  const bk=i.backing||'N/A';
  if(j==='BW') add('backing','가우징/배킹 Gouging/Backing',bk,(BACKING[bk]||[bk]).join(', '),'ISO 9606-1 Table 7', bk==='ss nb'?'high':'check');
  else add('backing','가우징/배킹 Gouging/Backing','N/A','N/A','—');

  // 두께
  const tr=thicknessRange(j,t), sr=thicknessRange(j,s);
  add('thickness','시험재 두께 Material Thickness',fmtN(t),rangeText(tr,'t'),'ISO 9606-1 Table 8', 'high');
  add('deposited','용접 두께 Deposited Thickness',fmtN(s),rangeText(sr,'s'),'ISO 9606-1 Table 8', 'high');

  // 용접 자세
  const posTable=j==='BW'?POS_BW:POS_FW, pos=String(i.position||'').toUpperCase();
  if(posTable[pos]) add('position','용접자세 Welding Position',pos,posTable[pos].join(', '),'ISO 9606-1 Table 9', (POS_HIGH[j]||[]).includes(pos)?'high':'check');
  else { manual=true; W.push(`자세 ${pos||'(미입력)'}: 자동 산출표에 없음 → 수동 검토`); add('position','용접자세 Welding Position',pos||'-','수동 확인','ISO 9606-1 Table 9','check'); }

  add('details','기타 Weld details',j==='BW'?bk+(bk==='ss nb'?'':''):'-', j==='BW'?(BACKING[bk]||[bk]).join(', '):'-','ISO 9606-1 5.7','check');
  return {items, warnings:W, manual_review_required:manual, expire: i.weldingDate?calcExpire(i.weldingDate):null};
}

function designation(i){
  const code=processCode(i.process), fm=String(i.fillerGroup||'').replace(/\s/g,'');
  const parts=['EN ISO 9606-1',code,i.productType||'P',i.joint,fm,i.fillerType||'S',`t${fmtN(i.thickness)}`,i.position];
  if(i.joint==='BW') parts.push('ss '+(/mb|ceramic/i.test(i.backing||'')?'mb':'nb'));
  return parts.filter(Boolean).join(' ');
}
/*ENGINE-END*/
</script>
<script>
// ===================== 저장소 (IndexedDB) =====================
const DB={db:null,
  open(){return new Promise((res,rej)=>{const r=indexedDB.open('welder-cert',2);
    r.onupgradeneeded=e=>{const d=e.target.result, has=n=>d.objectStoreNames.contains(n);
      if(!has('welders')) d.createObjectStore('welders',{keyPath:'id',autoIncrement:true});
      if(!has('records')) d.createObjectStore('records',{keyPath:'id',autoIncrement:true});
      if(!has('settings')) d.createObjectStore('settings',{keyPath:'key'});
      if(!has('images')) d.createObjectStore('images',{keyPath:'id',autoIncrement:true});};
    r.onsuccess=e=>{this.db=e.target.result;res()};r.onerror=()=>rej(r.error);});},
  tx(s,m,f){return new Promise((res,rej)=>{const t=this.db.transaction(s,m);const q=f(t.objectStore(s));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error);});},
  all(s){return this.tx(s,'readonly',o=>o.getAll());},
  put(s,v){return this.tx(s,'readwrite',o=>o.put(v));},
  putMany(s,arr){return new Promise((res,rej)=>{const t=this.db.transaction(s,'readwrite');const o=t.objectStore(s);const ids=[];arr.forEach((v,i)=>{const q=o.put(v);q.onsuccess=()=>ids[i]=q.result;});t.oncomplete=()=>res(ids);t.onerror=()=>rej(t.error);});},
  del(s,id){return this.tx(s,'readwrite',o=>o.delete(id));},
  clear(s){return this.tx(s,'readwrite',o=>o.clear());}
};
const DEFAULT_SETTINGS={company:'',team:'',examiner:'',location:'',standardLabel:'KS B ISO 9606-1:2012',refPrefix:'EN ISO 9606-1-RM',strict:false,impliedVT:true,logo:'',signature:'',stamp:''};
let S={...DEFAULT_SETTINGS}, welders=[], records=[], images=[];
async function load(){
  welders=await DB.all('welders'); records=await DB.all('records');
  const st=await DB.all('settings'); S={...DEFAULT_SETTINGS}; st.forEach(x=>S[x.key]=x.value);
  images=await DB.all('images');
  // 이전 버전에서 설정에만 저장돼 있던 이미지를 보관함으로 옮긴다
  let moved=false; for(const k of ['logo','signature','stamp']) if(S[k]&&!images.some(i=>i.kind===k&&i.data===S[k])){ await DB.put('images',{kind:k,data:S[k],name:'기존 이미지',created:Date.now()}); moved=true; }
  if(moved) images=await DB.all('images');
}
async function saveSettings(){ for(const k in S) await DB.put('settings',{key:k,value:S[k]}); }
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const RES={pass:'Pass',fail:'Fail',na:'미실시'};
const JLBL={pass:'합격',fail:'불합격',pending:'진행중'};
function pill(st){return `<span class="pill ${st}">${JLBL[st]}</span>`;}
function fileToDataURL(file,max,png){ // 이미지를 축소해 DB 용량을 줄인다 (png=true: 투명 배경 유지)
  return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{
    const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');
    c.width=im.width*k;c.height=im.height*k;const x=c.getContext('2d');if(!png){x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);}x.drawImage(im,0,0,c.width,c.height);

function rz(box,key){ // 표 머리글 경계를 끌어 열 너비 조절 (엑셀처럼), 너비는 브라우저에 기억
  const t=box.querySelector('table'); if(!t) return;
  const ths=[...t.querySelectorAll('thead th')]; let saved=null;
  try{saved=JSON.parse(localStorage.getItem('cw-'+key));}catch(e){}
  t.classList.add('measure'); t.style.width='max-content'; t.style.tableLayout='auto';
  const nat=ths.map(th=>Math.min(Math.max(Math.ceil(th.getBoundingClientRect().width)+6,48),th.textContent.trim()?280:620));
  const w=saved&&saved.length===ths.length?saved.slice():nat.slice();
  const cg=document.createElement('colgroup'); w.forEach(x=>{const c=document.createElement('col');c.style.width=x+'px';cg.appendChild(c);}); t.prepend(cg);
  const total=()=>{t.style.width=w.reduce((a,b)=>a+b,0)+'px';}; t.style.tableLayout='fixed'; t.classList.remove('measure'); total();
  const save=()=>{try{localStorage.setItem('cw-'+key,JSON.stringify(w));}catch(e){}};
  ths.forEach((th,i)=>{ const h=document.createElement('span'); h.className='rh'; h.title='드래그: 너비 조절 / 더블클릭: 자동 맞춤'; th.appendChild(h);
    h.onmousedown=e=>{e.preventDefault();e.stopPropagation();const x0=e.clientX,w0=w[i];
      const mv=ev=>{w[i]=Math.max(36,w0+ev.clientX-x0);cg.children[i].style.width=w[i]+'px';total();};
      const up=()=>{document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);save();};
      document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up);};
    h.ondblclick=()=>{w[i]=nat[i];cg.children[i].style.width=w[i]+'px';total();save();}; });
}

    if(isZip||/\.xlsx$/i.test(file.name)){

      if(typeof DecompressionStream==='undefined') return alert('이 브라우저는 엑셀 직접 읽기를 지원하지 않습니다. 최신 Chrome/Edge를 사용하세요.');

  while(e>=0&&dv.getUint32(e,true)!==0x06054b50) e--;

  const n=dv.getUint16(e+10,true); let p=dv.getUint32(e+16,true); const files={};
  for(let i=0;i<n&&dv.getUint32(p,true)===0x02014b50;i++){
    const method=dv.getUint16(p+10,true), cs=dv.getUint32(p+20,true), nl=dv.getUint16(p+28,true), el=dv.getUint16(p+30,true), cl=dv.getUint16(p+32,true), off=dv.getUint32(p+42,true);

    files[name]=async()=>{const st=off+30+dv.getUint16(off+26,true)+dv.getUint16(off+28,true); const d=u8.subarray(st,st+cs);
      return new TextDecoder().decode(method===0?d:await inflateRaw(d));};

}

function mapWorkbook(sheets){

   ${st==='pass'?`<button class="b sm" onclick="showCert(${r.id})">인증서</button> <button class="b sm sec" onclick="addRenewal(${r.id})">6개월 서명</button>`:''}
   <button class="b sm red" onclick="delRec(${r.id})">삭제</button></td></tr>`;}).join('')||'<tr><td colspan="14" style="color:var(--mute)">조건에 맞는 기록이 없습니다.</td></tr>'}</tbody></table>`;
  rz($('#rlist'),'records');
  $('#rpager').innerHTML=pages>1?`<button class="b sm sec" ${RF.page?'':'disabled'} onclick="RF.page--;drawRecs()">← 이전</button><span>${RF.page+1} / ${pages} 페이지</span><button class="b sm sec" ${RF.page<pages-1?'':'disabled'} onclick="RF.page++;drawRecs()">다음 →</button>`:'';
}
const COND=['project','wpsNo','process','productType','pipeDiameter','joint','transfer','fillerGroup','fillerType','materialGroup','gas','backing','thickness','deposited','position'];
function newRec(){ if(!welders.length) return alert('먼저 용접사를 등록하세요.');
  const last=[...records].sort((a,b)=>b.id-a.id)[0]; // 직전에 입력한 기록의 조건을 기본값으로
  editRec={...FIELDS_DEFAULT,...(last?Object.fromEntries(COND.map(k=>[k,last[k]])):{}),tests:{},renewals:[],welderId:last?last.welderId:welders[0].id}; vRecords(); }
function copyRec(id){ const r=records.find(x=>x.id===id);
  editRec={...FIELDS_DEFAULT,...Object.fromEntries(COND.map(k=>[k,r[k]])),welderId:r.welderId,weldingDate:today(),tests:{},renewals:[],refNo:'',issueDate:''}; vRecords(); }
function condList(){ // 기존 기록의 시험 조건 조합 (자주 쓴 순)
  const m=new Map(); for(const r of records){const k=COND.map(c=>r[c]).join('|'); const e=m.get(k)||{r,n:0}; e.n++; m.set(k,e);}
  return [...m.values()].sort((a,b)=>b.n-a.n).slice(0,60); }
function editR(id){editRec=JSON.parse(JSON.stringify(records.find(r=>r.id===id)));vRecords();}
async function delRec(id){if(confirm('삭제할까요?')){await DB.del('records',id);await load();vRecords();}}
async function addRenewal(id){const r=records.find(x=>x.id===id);r.renewals=r.renewals||[];
  if(r.renewals.length>=5) return alert('서명 갱신은 최대 5회입니다.');
  const d=prompt('서명 갱신일 (YYYY-MM-DD)',today()); if(!d) return; r.renewals.push(d); await DB.put('records',r); await load(); vRecords();}

function sel(name,opts,val){return `<select name="${name}">${opts.map(o=>{const [v,l]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}" ${String(v)===String(val)?'selected':''}>${esc(l)}</option>`}).join('')}</select>`;}
function vRecForm(){
  const r=editRec, T=r.tests||{}, R3=[['na','미실시'],['pass','Pass'],['fail','Fail']];
  const CL=condList();
  $('#view').innerHTML=`<form id="rf"><div class="card"><h2>${r.id?'시험 기록 수정':'새 시험 기록 (WQT)'}</h2>
   <div class="row" style="margin:0 0 10px"><label style="flex:1;max-width:640px">기존 기록의 시험 조건 불러오기 (프로젝트·공정·형상·두께·자세·용가재 등)
    <select id="cond"><option value="">— 선택하면 아래 조건이 채워집니다 (용접사·용접일·검사결과는 유지) —</option>${CL.map((x,i)=>`<option value="${i}">${esc(x.r.project||'(프로젝트 없음)')} · ${x.r.joint} ${esc(x.r.process)} t${fmtN(x.r.thickness)} ${esc(x.r.position)} ${esc(x.r.fillerGroup)} (${x.n}건)</option>`).join('')}</select></label></div>
   ${dl('dl-project',uniq(records.map(x=>x.project)))}${dl('dl-wps',uniq(records.map(x=>x.wpsNo)))}${dl('dl-fg',uniq(records.map(x=>x.fillerGroup)))}${dl('dl-gas',uniq(records.map(x=>x.gas)))}${dl('dl-pos',uniq(records.map(x=>x.position)))}
   <div class="grid">
   <label>용접사*<select name="welderId">${welders.map(w=>`<option value="${w.id}" ${w.id===r.welderId?'selected':''}>${esc(w.welderNo)} · ${esc(w.name)}</option>`).join('')}</select></label>
   <label>시험재 용접일자*<input type="date" name="weldingDate" value="${r.weldingDate}" required></label>
   <label>프로젝트/제작품목<input name="project" value="${esc(r.project)}" list="dl-project"></label>
   <label>WPS No.<input name="wpsNo" value="${esc(r.wpsNo)}" placeholder="WPS-RM013" list="dl-wps"></label>
   <label>용접방법<select name="process">${['135 MAG','136 FCAW','141 TIG','111 MMA','121 SAW','521 LBW'].map(x=>`<option ${x===r.process?'selected':''}>${x}</option>`).join('')}</select></label>
   <label>판재/파이프${sel('productType',[['P','P (판재)'],['T','T (파이프)']],r.productType)}</label>
   <label>파이프 외경 D(mm)<input type="number" step="any" name="pipeDiameter" value="${r.pipeDiameter}"></label>
   <label>용접 유형${sel('joint',['BW','FW'],r.joint)}</label>
   <label>용접 이행${sel('transfer',[['globular/spray','Globular/Spray'],['short','Short circuit'],['pulsed','Pulsed']],r.transfer)}</label>
   <label>용가재 그룹<input name="fillerGroup" value="${esc(r.fillerGroup)}" list="dl-fg"></label>
   <label>용가재 종류${sel('fillerType',['S','M','B'],r.fillerType)}</label>
   <label>재질 그룹 (Material Group)<input name="materialGroup" value="${esc(r.materialGroup)}" placeholder="1.1"></label>
   <label>보호가스<input name="gas" value="${esc(r.gas)}" list="dl-gas"></label>
   <label>배킹${sel('backing',['ss nb','ss mb','bs','N/A'],r.backing)}</label>
   <label>시험재 두께 t (mm)<input type="number" step="any" name="thickness" value="${r.thickness}" required></label>
   <label>용접 두께 s (mm)<input type="number" step="any" name="deposited" value="${r.deposited}"></label>
   <label>용접 자세<input name="position" value="${esc(r.position)}" placeholder="PA / PC / PF ..." list="dl-pos"></label></div>
  <h3>검사 결과</h3><div class="grid">
   <label>VT 육안${sel('vt',R3,T.vt||'na')}</label><label>RT/UT 체적${sel('rtut',R3,T.rtut||'na')}</label>
   <label>Bend 굽힘${sel('bend',R3,T.bend||'na')}</label><label>Macro 단면${sel('macro',R3,T.macro||'na')}</label>
   <label>Fracture 파단${sel('fracture',R3,T.fracture||'na')}</label><label>Additional 기타 시험${sel('additional',R3,T.additional||'na')}</label></div>
  <h3>인증서 발행 정보</h3><div class="grid">
   <label>Reference No.<input name="refNo" value="${esc(r.refNo)}" placeholder="비우면 자동 생성"></label>
   <label>발행일자<input type="date" name="issueDate" value="${r.issueDate||''}"></label>
   <label>Job knowledge${sel('jobKnowledge',['Acceptable','Not tested'],r.jobKnowledge||'Acceptable')}</label>
   <label>Supplementary fillet weld test${sel('suppFillet',['No','Yes'],r.suppFillet||'No')}</label></div></div>
  <div class="card"><h2>승인 범위 (자동 산출) <span id="pj"></span></h2><div id="rng"></div></div>
  <div class="row"><button class="b">저장</button><button type="button" class="b sec" onclick="editRec=null;vRecords()">취소</button></div></form>`;
  const f=$('#rf');
  const collect=()=>{const o=Object.fromEntries(new FormData(f));
    return {...r,welderId:+o.welderId,weldingDate:o.weldingDate,project:o.project,wpsNo:o.wpsNo,process:o.process,productType:o.productType,pipeDiameter:o.pipeDiameter,
     joint:o.joint,transfer:o.transfer,fillerGroup:o.fillerGroup,fillerType:o.fillerType,materialGroup:o.materialGroup,gas:o.gas,backing:o.backing,thickness:+o.thickness,deposited:+o.deposited||+o.thickness,position:o.position.trim().toUpperCase(),
     tests:(S.impliedVT?applyImpliedVT:x=>x)({vt:o.vt,rtut:o.rtut,bend:o.bend,macro:o.macro,fracture:o.fracture,additional:o.additional}),refNo:o.refNo,issueDate:o.issueDate,jobKnowledge:o.jobKnowledge,suppFillet:o.suppFillet};};
  const upd=()=>{const c=collect(),res=calculateRangeOfApproval(c),st=judge(c.joint,c.tests,S.strict);
    if(f.elements.vt.value!==(c.tests.vt||'na')) f.elements.vt.value=c.tests.vt; // 자동 통과 처리 표시
    $('#pj').innerHTML=pill(st)+` <small style="font-weight:400">유효: ${validityText(c.weldingDate,res.expire||'')}</small>`;
    $('#rng').innerHTML=(res.manual_review_required?'<div class="msg err">⚠ 자동 산출 불가 항목이 있습니다. 규격서를 보고 인증서 발행 전에 확인하세요.</div>':'')+
     res.warnings.map(w=>`<div class="msg info">${esc(w)}</div>`).join('')+
     `<table class="range" style="width:100%"><tr><th align=left>항목</th><th align=left>시험 조건</th><th align=left>승인 범위</th><th align=left>근거</th></tr>${res.items.map(x=>
     `<tr><td>${esc(x.label)}</td><td>${esc(x.test)}</td><td><b>${esc(x.range)}</b></td><td><small>${esc(x.source)}</small> ${x.confidence==='check'?'<span class="chk">⚠ 원문 대조</span>':''}</td></tr>`).join('')}</table>`;};
  f.oninput=upd; f.onchange=upd; upd();
  $('#cond').onchange=e=>{ if(e.target.value==='') return; const src=CL[+e.target.value].r;
    editRec={...collect(),...Object.fromEntries(COND.map(k=>[k,src[k]]))}; vRecForm(); };
  f.onsubmit=async e=>{e.preventDefault();const c=collect();
    if(!c.refNo){const n=records.filter(x=>x.welderId===c.welderId&&x.id!==c.id).length+1;
      c.refNo=`${S.refPrefix}-${n}-${processCode(c.process)}-T${fmtN(c.thickness)}-${c.joint}-${c.position}`;}
    await DB.put('records',c); await load(); editRec=null; vRecords();};
}

// ===================== 인증서 =====================
function certHTML(r){
  const w=welders.find(x=>x.id===r.welderId)||{}, res=calculateRangeOfApproval(r), R=Object.fromEntries(res.items.map(x=>[x.key,x]));
  const exp=calcExpire(r.weldingDate), T=r.tests||{}, mk=v=>v==='pass'?'o':'X', issued=r.issueDate||today();
  const row=(lbl,k)=>`<tr><td class="c">${lbl}</td><td class="c">${esc(R[k].test)}</td><td class="c">${esc(R[k].range)}</td></tr>`;
  const bw=r.joint==='BW';
  return `<div class="cert">
  <div class="top"><div class="co">${S.logo?`<img src="${S.logo}" style="max-height:14mm">`:esc(S.company)}</div>
   <div class="ti"><b>용접사 승인 시험 인증서</b><b style="font-size:11pt">Welder's Approval test certificate</b></div>
   <div class="tm">${esc(S.team)}</div></div>
  <table class="noborder" style="margin-bottom:2mm"><tr><td colspan="2"><b>Designation :</b> <span class="val">${esc(designation(r))}</span></td></tr>
   <tr><td style="width:60%"><b>인증번호 Reference No. :</b> <span class="val">${esc(r.refNo)}</span></td><td><b>용접사 성명 Welder's Name :</b> <span class="val">${esc(w.name)}</span></td></tr></table>
  <table class="noborder"><tr><td style="width:60%;vertical-align:top">
    <div><b>용접사 번호 Welder's ID No. :</b> <span class="val">${esc(w.welderNo)}</span></div>
    <div><b>ID 확인 Method of identification :</b> Personal I.D No.</div>
    <div><b>출생지, 생년월일 :</b> <span class="val">${esc(w.birthPlace)}${w.birthPlace&&w.birthDate?', ':''}${(w.birthDate||'').replace(/-/g,'.')}</span></div>
    <div><b>Code/Testing Standard :</b> ${esc(S.standardLabel)}</div>
    <div><b>소속 Employer :</b> ${esc(w.company)}</div>
    <div><b>Supplementary fillet weld test :</b> <span class="val">${esc(r.suppFillet||'No')}</span></div>
    <div><b>Job knowledge :</b> <span class="val">${esc(r.jobKnowledge||'Acceptable')}</span></div></td>
   <td style="vertical-align:top"><table><tr><th>Photo</th></tr><tr><td class="c" style="height:40mm">${w.photo?`<img class="photo" src="${w.photo}">`:''}</td></tr></table></td></tr></table>
  <table style="margin-top:2mm"><tr><th style="width:26%">Division</th><th>Weld Test Detail</th><th>Range of Approval</th></tr>
   ${row('용접방법 Welding process','process')}${row('판재 또는 파이프 Plate or pipe','product')}${row('용접 유형 Type of Weld','joint')}${row('용접 이행 Transfer mode','transfer')}${row('모재 그룹 Material Group','material')}
   ${row('용가재 그룹 Filler material group','fillerGroup')}${row('용가재 Filler material designation','fillerType')}${row('보호가스 Shielding gas','gas')}${row('가우징/배킹 Gouging/Backing','backing')}
   ${row('시험재 두께 Material Thickness','thickness')}${row('용접 두께 Deposited Thickness','deposited')}${row('파이프 직경 Pipe diameter','diameter')}${row('용접자세 Welding Position','position')}${row('기타 Weld details','details')}</table>
  <div style="margin:2mm 0"><b>Additional Information</b> is available on attached sheet and / or WPS No : ${esc(r.wpsNo)}</div>
  <table class="noborder"><tr><td style="width:50%;vertical-align:top"><table>
    <tr><th>Type of test</th><th>Performed and accepted</th></tr>
    <tr><td>육안검사 Visual Testing</td><td class="c">${mk(T.vt)}</td></tr>
    <tr><td>X-ray or UT 방사선/초음파</td><td class="c">${mk(T.rtut)}</td></tr>
    <tr><td>단면검사 Macroscopic examination</td><td class="c">${mk(T.macro)}</td></tr>
    <tr><td>파단시험 Fracture Test</td><td class="c">${mk(T.fracture)}</td></tr>
    <tr><td>굽힘 시험 Bend Test</td><td class="c">${mk(T.bend)}</td></tr>
    <tr><td>기타 시험 Additional Test</td><td class="c">${mk(T.additional)}</td></tr></table></td>
   <td style="vertical-align:top"><div><b>시험기관 Examiner :</b> ${esc(S.company)}</div><div><b>성명 Name :</b> ${esc(S.examiner)}</div>
    <div class="sigbox"><b>서명 Signature :</b>${S.stamp?`<img class="stamp" src="${S.stamp}">`:''}${S.signature?`<img class="sign" src="${S.signature}">`:''}</div>
    <div><b>장소 Location :</b> ${esc(S.location)}</div>
    <div><b>용접일자 Date of Welding :</b> ${r.weldingDate}</div><div><b>발행일자 Date of issue :</b> ${issued}</div></td></tr></table>
  <div style="margin:3mm 0"><b>유효기간 Validity of approval :</b> <span class="val">${validityText(r.weldingDate,exp)}</span></div>
  <div><b>Prolongation for approval by employer/coordinator following 6months (refer to 9.2)</b></div>
  <table style="margin-top:1mm"><tr><th>Date</th><th>Signature</th><th>Position or title</th><th>Date</th><th>Signature</th><th>Position or title</th></tr>
   ${[0,1,2].map(i=>`<tr><td style="height:7mm">${esc((r.renewals||[])[i]||'')}</td><td></td><td></td><td>${esc((r.renewals||[])[i+3]||'')}</td><td></td><td></td></tr>`).join('')}</table>
  </div>`;
}
function showCert(id){const r=records.find(x=>x.id===id),res=calculateRangeOfApproval(r);
  if(res.manual_review_required&&!confirm('수동 검토가 필요한 항목이 있습니다 (승인 범위 "수동 확인" 표시). 그래도 미리보기를 열까요?')) return;
  $('#modalBody').innerHTML=certHTML(r); $('#modal').classList.remove('hide'); }
function closeModal(){$('#modal').classList.add('hide');}

// ===================== 설정 · 백업 =====================
function vSettings(){
  $('#view').innerHTML=`<div class="card"><h2>인증서 발행 정보</h2><form id="sf"><div class="grid">
   <label>회사명 (로고 없을 때 표시)<input name="company" value="${esc(S.company)}"></label>
   <label>부서/팀 (우측 상단 박스)<input name="team" value="${esc(S.team)}"></label>
   <label>시험 책임자 성명<input name="examiner" value="${esc(S.examiner)}"></label>
   <label>장소 Location<input name="location" value="${esc(S.location)}"></label>
   <label>Code/Testing Standard 표기<input name="standardLabel" value="${esc(S.standardLabel)}"></label>
   <label>Reference No. 접두어<input name="refPrefix" value="${esc(S.refPrefix)}"></label>
   </div>
   <h3>로고 · 서명 · 직인 (붙여넣은 이미지는 보관함에 계속 저장됩니다)</h3>${imgSection()}
   <label style="flex-direction:row;align-items:center;gap:8px;margin-top:10px;color:var(--ink)"><input type="checkbox" name="impliedVT" ${S.impliedVT?'checked':''}>
   VT 자동 통과 처리: VT를 따로 기록하지 않아도 RT/UT·굽힘·단면 결과가 있으면 VT는 이미 통과한 것으로 간주 (입력·가져오기 시 적용)</label>
   <label style="flex-direction:row;align-items:center;gap:8px;margin-top:10px;color:var(--ink)"><input type="checkbox" name="strict" ${S.strict?'checked':''}>
   사내 엄격 기준 사용 (BW: VT+RT/UT+Bend 모두 Pass, FW: VT+Macro Pass). 해제 시 ISO 9606-1 Table 1 기준(BW: VT + RT/UT 또는 Bend/Fracture)</label>
   <div class="row"><button class="b">저장</button></div></form></div>
  <div class="card"><h2>표시</h2><button class="b sec" onclick="resetWidths()">표 열 너비 초기화</button> <small style="color:var(--mute)">표 머리글 경계를 드래그해서 열 너비를 조절할 수 있습니다 (브라우저에 저장).</small></div>
  <div class="card"><h2>백업 / 복원</h2><div class="row"><button class="b" onclick="exportAll()">JSON 백업 다운로드</button>
   <input type="file" accept=".json" onchange="importAll(this.files[0])"><small style="color:var(--mute)">복원하면 현재 데이터가 모두 대체됩니다.</small></div>
   <p style="color:var(--mute)">데이터는 이 브라우저(IndexedDB)에만 저장됩니다. 브라우저 데이터를 지우면 사라지므로 주기적으로 백업하세요.</p></div>`;
  $('#sf').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target);
    for(const k of ['company','team','examiner','location','standardLabel','refPrefix']) S[k]=fd.get(k);
    S.strict=fd.get('strict')==='on'; S.impliedVT=fd.get('impliedVT')==='on';
    await saveSettings(); vSettings(); alert('저장했습니다.');};
}
function exportAll(){download(`welder-backup-${today()}.json`,JSON.stringify({version:2,welders,records,settings:S,images}),'application/json');}
async function importAll(file){ if(!file) return; let d; try{d=JSON.parse(await file.text());}catch(e){return alert('JSON 형식이 아닙니다.');}
  if(!Array.isArray(d.welders)||!Array.isArray(d.records)) return alert('백업 파일 형식이 올바르지 않습니다.');
  if(!confirm('현재 데이터를 모두 지우고 복원할까요?')) return;
  await DB.clear('welders');await DB.clear('records');await DB.clear('settings');await DB.clear('images');
  if(Array.isArray(d.images)) await DB.putMany('images',d.images.map(({id,...x})=>x));
  for(const w of d.welders) await DB.put('welders',w); for(const r of d.records) await DB.put('records',r);
  S={...DEFAULT_SETTINGS,...(d.settings||{})}; await saveSettings(); await load(); render(); }

DB.open().then(load).then(render).catch(e=>{document.body.insertAdjacentHTML('beforeend','<div class="msg err">저장소를 열 수 없습니다: '+esc(e)+'</div>');});
</script>
</body>
</html>
